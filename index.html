<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Atlas interactivo para estudiar países, capitales, banderas, accidentes geográficos y cartografía.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230e5a87'/%3E%3Cpath d='M2 16h28M16 2c5 4 5 24 0 28M16 2c-5 4-5 24 0 28' stroke='%23fff' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Atlas de Estudio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,400;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mapa protagonista a pantalla completa + panel lateral (hoja inferior en móvil); barra superior con pestañas. */
:root{
  --bg:#e9eef0; --panel:#fbfcfc; --panel2:#f1f5f6; --ink:#16242f; --muted:#5a6b77; --line:#cfd9de;
  --accent:#0e5a87; --accent-ink:#ffffff; --accent-soft:#d8e8f1;
  --ocean:#cddfe8; --ocean-deep:#b9d1de; --land-line:#ffffff; --grat:#a9c3d1;
  --p1:#e9dcc0; --p2:#d6e3c3; --p3:#f0cfc4; --p4:#d9d2e6; --p5:#f3e6a8; --p6:#c9dfe0;
  --sel:#1640a3; --dispute-red:#d0261b; --dispute-orange:#ef8a00; --colony:#8b3fb5; --change:#0f8f86;
  --ok:#2c8a4b; --ok-soft:#dcefe2; --bad:#c03a2b; --bad-soft:#f6dcd8; --warn:#9a6a00; --warn-soft:#f8edcc;
  --m0:#c6ced3; --m1:#f2a65a; --m2:#f2d65a; --m3:#7cc27f; --m4:#2a8a5a;
  --water-label:#2b5f86; --range-label:#7a4a22; --region-label:#8a5a2e; --peak:#3b2b1f;
  --shadow:0 1px 2px rgba(20,40,60,.08),0 6px 24px rgba(20,40,60,.10);
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --panel-w:390px; --bar-h:54px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161d; --panel:#141f28; --panel2:#1a2833; --ink:#e3ebf0; --muted:#93a5b2; --line:#2a3b48;
  --accent:#5fb0e0; --accent-ink:#06131c; --accent-soft:#163246;
  --ocean:#13222e; --ocean-deep:#0f1c26; --land-line:#0e161d; --grat:#24394a;
  --p1:#4a4433; --p2:#3a4a35; --p3:#53393a; --p4:#403b55; --p5:#4f4a2c; --p6:#2f4a4c;
  --sel:#8fb4ff; --dispute-red:#ff5a4d; --dispute-orange:#ffa733; --colony:#c58af0; --change:#39c9bd;
  --ok:#5cc983; --ok-soft:#173726; --bad:#ff7a6a; --bad-soft:#3c1c18; --warn:#e6b64a; --warn-soft:#3a2f12;
  --m0:#3a4752; --m1:#c97a32; --m2:#c9ad32; --m3:#4f9e5a; --m4:#7fe0a6;
  --water-label:#9cc8ea; --range-label:#e8b98d; --region-label:#e0b48a; --peak:#f0e2d2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161d; --panel:#141f28; --panel2:#1a2833; --ink:#e3ebf0; --muted:#93a5b2; --line:#2a3b48;
  --accent:#5fb0e0; --accent-ink:#06131c; --accent-soft:#163246;
  --ocean:#13222e; --ocean-deep:#0f1c26; --land-line:#0e161d; --grat:#24394a;
  --p1:#4a4433; --p2:#3a4a35; --p3:#53393a; --p4:#403b55; --p5:#4f4a2c; --p6:#2f4a4c;
  --sel:#8fb4ff; --dispute-red:#ff5a4d; --dispute-orange:#ffa733; --colony:#c58af0; --change:#39c9bd;
  --ok:#5cc983; --ok-soft:#173726; --bad:#ff7a6a; --bad-soft:#3c1c18; --warn:#e6b64a; --warn-soft:#3a2f12;
  --m0:#3a4752; --m1:#c97a32; --m2:#c9ad32; --m3:#4f9e5a; --m4:#7fe0a6;
  --water-label:#9cc8ea; --range-label:#e8b98d; --region-label:#e0b48a; --peak:#f0e2d2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--panel)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:var(--bar-h) 1fr;height:100%}
/* barra superior */
.bar{display:flex;align-items:center;gap:14px;background:var(--panel);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:20;min-width:0}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.01em;white-space:nowrap;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:10.5px;font-weight:400;color:var(--muted);letter-spacing:.06em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 13px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{background:var(--panel2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.bar-right{display:flex;gap:8px;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--ink);background:var(--panel2)}
.sync{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
/* zona principal */
.main{position:relative;min-height:0;display:grid;grid-template-columns:1fr var(--panel-w)}
.mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--ocean-deep)}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-width:0;padding-block:16px 28px;padding-left:18px;padding-right:max(18px,env(safe-area-inset-right,0px))}
.page{position:absolute;inset:0;overflow-y:auto;background:var(--bg);z-index:5}
.page-inner{max-width:1080px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-handle{display:none}
/* controles del mapa */
.mapctl{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px;z-index:4}
.mapctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);font-size:18px;line-height:1;color:var(--ink)}
.searchbox{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:12px;z-index:4;width:min(320px,calc(100% - 80px))}
.searchbox input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.searchbox svg{position:absolute;left:11px;top:11px;color:var(--muted)}
.sugg{margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:300px;overflow:auto}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 12px}
.sugg button:hover,.sugg button.on{background:var(--accent-soft)}
.sugg img{width:24px;height:18px;border-radius:2px;object-fit:cover;box-shadow:0 0 0 1px var(--line)}
.sugg small{color:var(--muted);margin-left:auto}
.legend{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);font-size:13.5px;max-width:300px}
.legend summary{padding:8px 12px;cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
.legend summary::-webkit-details-marker{display:none}
.legend summary::after{content:"▾";color:var(--muted)}
.legend[open] summary::after{content:"▴"}
.legend .rows{padding:0 12px 10px;display:grid;gap:5px}
.legend label{display:grid;grid-template-columns:18px 34px 1fr;align-items:center;gap:6px;cursor:pointer}
.legend svg{display:block}
.legend .note{color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}
.tooltip{position:absolute;pointer-events:none;z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px 10px;font-size:13.5px;max-width:300px;line-height:1.35}
.tooltip b{display:block}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:999px;font-size:14px;z-index:9;box-shadow:var(--shadow)}
/* SVG del mapa */
.ocean{fill:var(--ocean)}
.grat{fill:none;stroke:var(--grat);stroke-width:.5px;vector-effect:non-scaling-stroke}
.cty{stroke:var(--land-line);stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .15s}
.cty.hov{filter:brightness(.94)}
.cty.dim{opacity:.45}
.phys .cty{fill:transparent;stroke:rgba(40,30,20,.32);stroke-width:.7px}
.phys .cty.hov{fill:rgba(255,255,255,.18);filter:none}
.ln{fill:none;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.ln-sel{stroke:var(--sel);stroke-width:2.6px}
.ln-sel-halo{stroke:var(--panel);stroke-width:5.5px;opacity:.8}
.ln-terr{stroke:var(--sel);stroke-width:2.2px;stroke-dasharray:7 4}
.ln-red{stroke:var(--dispute-red);stroke-width:2.2px;stroke-dasharray:3 3}
.ln-orange{stroke:var(--dispute-orange);stroke-width:2.2px;stroke-dasharray:3 3}
.ln-colony{stroke:var(--colony);stroke-width:2px;stroke-dasharray:1.5 3.5}
.ln-change{stroke:var(--change);stroke-width:2px;stroke-dasharray:9 3 2 3}
.fill-hit{fill:transparent;stroke:transparent;stroke-width:10px;vector-effect:non-scaling-stroke;pointer-events:all;cursor:help}
.ln-ok{stroke:var(--ok);stroke-width:3px}
.ln-bad{stroke:var(--bad);stroke-width:3px}
.f-ok{fill:var(--ok)!important;fill-opacity:.75}
.f-bad{fill:var(--bad)!important;fill-opacity:.7}
.f-q{fill:var(--sel)!important;fill-opacity:.85}
.mk{stroke:var(--panel);vector-effect:non-scaling-stroke;stroke-width:1.2px;cursor:pointer}
.city-dot{fill:var(--panel);stroke:var(--ink);stroke-width:1.2px;vector-effect:non-scaling-stroke}
.city-cap{fill:var(--ink);stroke:var(--panel);stroke-width:1px;vector-effect:non-scaling-stroke}
.lbl{font-family:var(--f-body);paint-order:stroke;stroke:var(--panel);stroke-linejoin:round;fill:var(--ink);pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.lbl-cty{font-weight:700;letter-spacing:.06em;text-transform:uppercase;fill:var(--muted)}
.lbl-city{font-weight:500}
.plab{font-family:var(--f-display);paint-order:stroke;stroke:rgba(255,255,255,.75);stroke-linejoin:round;text-anchor:middle;dominant-baseline:middle;cursor:pointer}
.plab:hover{text-decoration:underline}
.plab.water{font-style:italic;fill:#245a82;stroke:rgba(225,238,246,.85)}
.plab.ocean-l{font-style:italic;letter-spacing:.3em;text-transform:uppercase;fill:#2b5f86;stroke:none;opacity:.85}
.plab.range{font-family:var(--f-body);font-weight:700;text-transform:uppercase;letter-spacing:.22em;fill:#74431c}
.plab.region{font-family:var(--f-body);font-weight:500;text-transform:uppercase;letter-spacing:.18em;fill:#80501f;font-style:italic}
.plab.on{fill:#0b2f8a!important}
.plab.land{fill:#33302b}
.plab.peak{font-family:var(--f-body);fill:#2e2219;font-size:.92em}
.plab.on{font-weight:700}
.peak-mk{fill:#2e2219;stroke:#fff;stroke-width:.8px;vector-effect:non-scaling-stroke;cursor:pointer}
.river{fill:none;stroke:#3f86c0;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.river:hover{stroke:#1250a0}
.lake{fill:#9fc6e2;stroke:#3f86c0;stroke-width:.5px;vector-effect:non-scaling-stroke}
.hl-poly{fill:var(--sel);fill-opacity:.18;stroke:var(--sel);stroke-width:2.4px;vector-effect:non-scaling-stroke;pointer-events:none}
.hl-line{fill:none;stroke:#ffde3b;stroke-width:5px;vector-effect:non-scaling-stroke;stroke-linecap:round;pointer-events:none}
.hl-line2{fill:none;stroke:var(--sel);stroke-width:2.4px;vector-effect:non-scaling-stroke;stroke-linecap:round;pointer-events:none}
.hl-pt{fill:#ffde3b;stroke:var(--sel);stroke-width:2.5px;vector-effect:non-scaling-stroke;pointer-events:none}
.click-mk{fill:none;stroke:var(--bad);stroke-width:2.5px;vector-effect:non-scaling-stroke;pointer-events:none}
/* panel: tipografía y componentes */
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:26px;font-weight:700}
h3{font-size:18px;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;font-weight:500}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
a.chip{color:var(--ink);text-decoration:none}
a.chip:hover{background:var(--panel2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.flag-big{width:100%;max-width:220px;aspect-ratio:4/3;border-radius:6px;box-shadow:0 0 0 1px var(--line),var(--shadow);display:block;background:var(--panel2)}
.flag-big svg,.flagbox svg{width:100%;height:100%;display:block}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;min-width:0}
.sec{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.sec h4{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.sec p{margin:0}
.chk{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;background:var(--warn-soft);color:var(--warn);border-radius:5px;padding:1px 6px;vertical-align:1px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;border-radius:999px;padding:2px 9px;background:var(--panel2);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.list{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.list button,.list .li{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:7px;min-width:0}
.list button:hover{background:var(--panel2)}
.list .meta{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;font-family:var(--f-mono)}
.swatch-line{width:30px;height:10px;flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.kv{font-family:var(--f-mono);font-size:13px}
/* examen */
.qcard{display:grid;gap:14px}
.qprompt{font-family:var(--f-display);font-size:25px;font-weight:700;line-height:1.2}
.qprompt .hint{display:block;font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--muted);margin-top:4px}
.qflag{width:100%;max-width:300px;aspect-ratio:4/3;border-radius:6px;box-shadow:0 0 0 1px var(--line),var(--shadow);overflow:hidden}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:11px;padding:11px 13px;font-size:16.5px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opts.flags{grid-template-columns:1fr 1fr}
.opt.flagopt{padding:6px;display:block}
.opt.flagopt .flagbox{aspect-ratio:4/3;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.answer-in{display:flex;gap:8px}
.answer-in input{flex:1;min-width:0;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--panel);font-size:17px}
.answer-in input:focus{border-color:var(--accent);outline:none}
.fb{border-radius:11px;padding:11px 13px;font-size:15.5px}
.fb.ok{background:var(--ok-soft);color:var(--ink);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
.fb.warn{background:var(--warn-soft);border-left:4px solid var(--warn)}
.score{display:flex;gap:14px;font-family:var(--f-mono);font-size:13px;color:var(--muted);flex-wrap:wrap}
.score b{color:var(--ink);font-weight:500}
.lvl{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-family:var(--f-mono)}
.setup{display:grid;gap:14px}
.setup fieldset{border:0;padding:0;margin:0;display:grid;gap:7px}
.setup legend{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;padding:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.typegrid label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:14px;cursor:pointer;background:var(--panel)}
.typegrid label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.typegrid input{margin-top:3px}
.toggle{display:flex;gap:8px;align-items:center;font-size:14.5px;cursor:pointer}
.kbd{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
/* progreso y cartografía */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:14.5px}
.barrow .track{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden;display:flex}
.barrow .track span{display:block;height:100%}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.bigstat{display:grid;gap:2px}
.bigstat b{font-family:var(--f-display);font-size:34px;line-height:1}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
textarea{width:100%;min-height:120px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:10px}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.carto h2{font-size:30px}
.carto section{display:grid;gap:14px;padding-block:26px;border-bottom:1px solid var(--line)}
.carto p{margin:0;max-width:68ch}
.carto .lead{font-size:18px;color:var(--muted);max-width:68ch}
.figure{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;min-width:0}
.figure figcaption{font-size:13.5px;color:var(--muted)}
.figure svg,.figure canvas{width:100%;height:auto;display:block;max-width:100%}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.projinfo{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:15px}
.projinfo dt{color:var(--muted)}.projinfo dd{margin:0}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.svgtxt{font-family:var(--f-body);fill:var(--ink)}
.svgmut{font-family:var(--f-body);fill:var(--muted)}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:30;font-family:var(--f-display);font-size:20px;color:var(--muted)}
@media (max-width:820px){
  :root{--bar-h:auto}
  .app{grid-template-rows:auto 1fr}
  .bar{flex-wrap:wrap;padding-block:8px;gap:6px 10px}
  .brand{font-size:18px}

  .tabs{order:3;flex-basis:100%}

  .panel{position:absolute;left:0;right:0;bottom:0;max-height:min(56%,520px);border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:4px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));transition:max-height .25s}
  .panel.collapsed{max-height:64px;overflow:hidden}

  .split{grid-template-columns:1fr}
  .barrow{grid-template-columns:110px 1fr 44px}
  .qprompt{font-size:21px}
}

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo-projection@4.0.0/dist/d3-geo-projection.min.js"></script>
<script>
'use strict';
/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ART = /^(el|la|los|las|the|l)\s+/;
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/['’`´.]/g, '').replace(/[^a-z0-9]+/g, ' ').trim().replace(ART, '');
function lev(a, b) {
  if (a === b) return 0; const m = a.length, n = b.length; if (!m || !n) return m || n;
  let prev = Array.from({ length: n + 1 }, (_, i) => i), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++) { cur[0] = i; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); [prev, cur] = [cur, prev]; }
  return prev[n];
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const uniq = a => [...new Set(a)];
const nf = new Intl.NumberFormat('es-ES');
function fmtPop(m) { if (m == null) return '—'; if (m >= 1) return (m >= 100 ? nf.format(Math.round(m)) : nf.format(+m.toFixed(1))) + ' millones'; return nf.format(Math.round(m * 1e6)) + ' hab.'; }
const fmtArea = a => a ? nf.format(Math.round(a)) + ' km²' : '—';
const verif = s => esc(s).replace(/\s*\(verificar[^)]*\)/g, ' <span class="chk" title="Dato muy reciente o cambiante: compruébalo">verificar</span>');
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const now = () => Date.now();
const isMobile = () => matchMedia('(max-width:820px)').matches;
function toast(msg, ms = 1800) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, ms); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
const REF_DATE = 'junio de 2026';
const REGIONS = ['Europa', 'África', 'Asia', 'América del Norte', 'Centroamérica y Caribe', 'América del Sur', 'Oceanía'];

/* ============ datos ============ */
const D = {};
async function loadData() {
  const get = p => fetch(p).then(r => { if (!r.ok) throw new Error('No se pudo cargar ' + p); return r.json(); });
  const [params, world, info, flags, special, phys, physGeo, sphere] = await Promise.all(
    ['params', 'world', 'info', 'flags', 'special', 'phys', 'phys_geo', 'sphere110'].map(n => get('data/' + n + '.json')));
  Object.assign(D, { params, world, info, flags, special, phys, physGeo, sphere });
  D.W = params.W; D.H = params.H;
  D.proj = d3.geoEqualEarth().scale(params.S).translate([D.W / 2, D.H / 2]);
  D.path = d3.geoPath();               // geometrías ya proyectadas
  D.ppath = d3.geoPath(D.proj);        // geometrías en lon/lat
  D.cfeat = topojson.feature(world, world.objects.countries).features;
  D.byId = Object.fromEntries(D.cfeat.map(f => [f.id, f]));
  D.extra = Object.fromEntries(topojson.feature(world, world.objects.extra).features.map(f => [f.id, f]));
  D.states = Object.keys(info).filter(id => info[id].state).sort((a, b) => info[a].name.localeCompare(info[b].name, 'es'));
  // partes de cada país: principal + lejanas + territorios
  D.parts = {};
  for (const f of D.cfeat) { const p = f.properties || {}; if (p.kind === 'far' || p.kind === 'territory') (D.parts[p.sov] = D.parts[p.sov] || []).push(f.id); }
  // colores políticos (coloreado voraz por vecindad)
  const geoms = world.objects.countries.geometries, nb = topojson.neighbors(geoms);
  const col = {}; const order = D.cfeat.map((f, i) => i).sort((a, b) => D.path.area(D.cfeat[b]) - D.path.area(D.cfeat[a]));
  for (const i of order) { const f = D.cfeat[i], p = f.properties || {}; if (p.kind === 'far' || p.kind === 'territory') continue; const used = new Set(nb[i].map(j => col[D.cfeat[j].id])); let c = 1; while (used.has(c) && c < 6) c++; col[f.id] = c; }
  for (const f of D.cfeat) { const p = f.properties || {}; if (!col[f.id]) col[f.id] = col[p.sov] || 6; }
  D.color = col;
  // bounding boxes y diminutos
  D.bbox = {}; D.tiny = [];
  for (const f of D.cfeat) { const b = D.path.bounds(f); D.bbox[f.id] = b; const diag = Math.hypot(b[1][0] - b[0][0], b[1][1] - b[0][1]); f.diag = diag; }
  for (const f of D.cfeat) { if (f.diag < 7 && f.id !== 'ATA') { const i = info[f.id]; const lab = i && i.lab ? D.proj([i.lab[0], i.lab[1]]) : D.path.centroid(largestPoly(f)); D.tiny.push({ id: f.id, x: lab[0], y: lab[1], diag: f.diag }); } }
  // índice de nombres para búsqueda
  D.searchIdx = Object.entries(info).filter(([id, e]) => !id.includes('-') || true).map(([id, e]) => ({ id, name: e.name, n: norm(e.name), alts: uniq((e.alts || []).map(norm)) }));
  // físico
  D.pitems = phys.items; D.pidx = phys.idx;
  D.pgeo = {};
  for (const o of ['marine', 'regions', 'lakes', 'rivers']) for (const f of topojson.feature(physGeo, physGeo.objects[o]).features) D.pgeo[f.id] = f;
  D.pRev = {}; // rasgo -> países
  for (const [cid, list] of Object.entries(D.pidx)) { const sov = baseId(cid); for (const fid of list) (D.pRev[fid] = D.pRev[fid] || new Set()).add(sov); }
}
function largestPoly(f) {
  const g = f.geometry; if (!g || g.type !== 'MultiPolygon') return f;
  let best = null, ba = -1; for (const c of g.coordinates) { const p = { type: 'Polygon', coordinates: c }; const a = D.path.area(p); if (a > ba) { ba = a; best = p; } } return best;
}
function baseId(id) { const f = D.byId[id]; const p = f && f.properties || {}; if (p.kind === 'far') return p.sov; return id; }
function geoRef(ref) { if (ref.startsWith('c:')) return D.byId[ref.slice(2)]; return D.extra[ref]; }
function flagSvg(id) { const e = D.info[id]; return e && e.iso2 && D.flags[e.iso2] ? D.flags[e.iso2] : '<svg viewBox="0 0 4 3"><rect width="4" height="3" fill="#ccc"/></svg>'; }
function flagUrl(id) { const s = flagSvg(id); return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); }
function nameOf(id) { const e = D.info[id]; return e ? e.name : id; }
function unionBounds(ids) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const id of ids) { const b = D.bbox[id]; if (!b) continue; x0 = Math.min(x0, b[0][0]); y0 = Math.min(y0, b[0][1]); x1 = Math.max(x1, b[1][0]); y1 = Math.max(y1, b[1][1]); }
  return [[x0, y0], [x1, y1]];
}
function boundsOf(feats) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const f of feats) { if (!f) continue; const b = D.path.bounds(f); if (!isFinite(b[0][0])) continue; x0 = Math.min(x0, b[0][0]); y0 = Math.min(y0, b[0][1]); x1 = Math.max(x1, b[1][0]); y1 = Math.max(y1, b[1][1]); }
  return [[x0, y0], [x1, y1]];
}
/* encuadre del país "propio" (sin territorios muy lejanos que distorsionan) */
function homeBounds(id) {
  const f = D.byId[id]; if (!f) return null;
  if (f.geometry && f.geometry.type === 'MultiPolygon') {
    // descarta islas muy lejanas y diminutas respecto del polígono mayor
    const polys = f.geometry.coordinates.map(c => ({ type: 'Polygon', coordinates: c })).map(p => ({ p, a: D.path.area(p), c: D.path.centroid(p) }));
    const big = polys.reduce((a, b) => a.a > b.a ? a : b);
    const keep = polys.filter(q => q.a > big.a * 0.02 || Math.hypot(q.c[0] - big.c[0], q.c[1] - big.c[1]) < 60);
    return boundsOf(keep.map(q => q.p));
  }
  return D.bbox[id];
}

/* ============ memoria de aprendizaje (repetición espaciada) ============ */
const INTERVALS_MIN = [1, 10, 60 * 24, 60 * 24 * 3, 60 * 24 * 8, 60 * 24 * 21, 60 * 24 * 60];
const LEVELS = [{ n: 'Nuevo', c: 'var(--m0)' }, { n: 'Aprendiendo', c: 'var(--m1)' }, { n: 'Repasando', c: 'var(--m2)' }, { n: 'Dominado', c: 'var(--m4)' }];
const STORE = {
  key: 'atlas-estudio-v1',
  d: { v: 1, items: {}, days: [], tot: { n: 0, ok: 0 }, set: {} },
  load() { const s = lsGet(this.key); if (s) { try { const x = JSON.parse(s); if (x && x.items) this.d = Object.assign(this.d, x); } catch (e) { } } },
  saveLocal() { lsSet(this.key, JSON.stringify(this.d)); },
  save() { this.saveLocal(); REMOTE.schedule(); },
  rec(key) { return this.d.items[key]; },
  // r = [caja, vence(min), vistas, aciertos, fallos, tiempoMedio(ds), última(min)]
  grade(key, q, ms) {
    const t = Math.floor(now() / 60000);
    const r = this.d.items[key] || [0, 0, 0, 0, 0, 0, 0];
    r[2]++; r[6] = t; r[5] = Math.round(((r[5] * (r[2] - 1)) + Math.min(ms, 60000) / 100) / r[2]);
    if (q === 0) { r[4]++; r[0] = Math.max(0, r[0] - 2); r[1] = t + 1; }
    else {
      r[3]++;
      if (q === 1) { r[0] = Math.max(1, r[0]); r[1] = t + Math.max(1, Math.round(INTERVALS_MIN[r[0]] * 0.4)); }
      else { r[0] = Math.min(6, r[0] + (q === 3 && r[0] >= 1 ? 2 : 1)); r[1] = t + INTERVALS_MIN[r[0]]; }
    }
    this.d.items[key] = r;
    this.d.tot.n++; if (q > 0) this.d.tot.ok++;
    const day = new Date().toISOString().slice(0, 10); if (!this.d.days.includes(day)) this.d.days.push(day);
    this.save();
    return r;
  },
  level(key) { const r = this.d.items[key]; if (!r || !r[2]) return 0; if (r[0] <= 1) return 1; if (r[0] <= 3) return 2; return 3; },
  weight(key, tmin) {
    const r = this.d.items[key];
    if (!r || !r[2]) return 1.0;                                   // nuevo
    const due = r[1] <= tmin;
    if (due) { const iv = INTERVALS_MIN[r[0]] || 1; return 3 + Math.min(3, (tmin - r[1]) / iv) + (r[4] > r[3] ? 1 : 0); }
    return 0.06 / (r[0] + 1) + (r[0] <= 1 ? 0.25 : 0);              // dominado: aparece de vez en cuando
  },
  pick(keys, avoid = []) {
    const tmin = Math.floor(now() / 60000);
    const learning = keys.filter(k => { const r = this.d.items[k]; return r && r[2] && r[0] <= 1; }).length;
    let tot = 0; const w = keys.map(k => { let x = avoid.includes(k) ? 0 : this.weight(k, tmin); if (!this.d.items[k] && learning >= 10) x *= 0.25; tot += x; return x; });
    if (tot <= 0) return keys[Math.random() * keys.length | 0];
    let r = Math.random() * tot; for (let i = 0; i < keys.length; i++) { r -= w[i]; if (r <= 0) return keys[i]; }
    return keys[keys.length - 1];
  },
  streak() {
    const set = new Set(this.d.days); let s = 0; const d = new Date();
    if (!set.has(d.toISOString().slice(0, 10))) d.setDate(d.getDate() - 1);
    while (set.has(d.toISOString().slice(0, 10))) { s++; d.setDate(d.getDate() - 1); }
    return s;
  },
  merge(o) {
    if (!o || !o.items) return;
    for (const [k, r] of Object.entries(o.items)) { const m = this.d.items[k]; if (!m || (r[6] || 0) > (m[6] || 0) || (r[2] > m[2] && (r[6] || 0) >= (m[6] || 0))) this.d.items[k] = r; }
    this.d.days = uniq([...(this.d.days || []), ...(o.days || [])]).sort();
    if (o.tot && o.tot.n > this.d.tot.n) this.d.tot = o.tot;
  },
  reset(prefixes) {
    if (!prefixes) { this.d.items = {}; this.d.days = []; this.d.tot = { n: 0, ok: 0 }; }
    else for (const k of Object.keys(this.d.items)) if (prefixes.some(p => k.startsWith(p))) delete this.d.items[k];
    this.save();
  }
};
/* copia en la nube privada del usuario (capacidad db), además del navegador */
const REMOTE = {
  db: null, uid: null, ready: false, t: null,
  async init() {
    try {
      if (!window.claude || !window.claude.use) return this.status('Progreso guardado en este navegador');
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return this.status('Progreso guardado en este navegador');
      const uid = await user.id(); if (!uid) return this.status('Progreso guardado en este navegador');
      this.db = db; this.uid = uid;
      const snap = await this.doc().get();
      if (snap.exists) { const v = snap.data(); STORE.merge(v && v.json ? JSON.parse(v.json) : null); STORE.saveLocal(); APP.refresh && APP.refresh(); }
      this.ready = true; this.status('Progreso sincronizado');
    } catch (e) { this.status('Progreso guardado en este navegador'); }
  },
  doc() { return this.db.doc('data/users/' + this.uid + '/atlas/progreso'); },
  status(t) { const s = $('#sync'); if (s) s.textContent = t; },
  schedule() { if (!this.ready) return; clearTimeout(this.t); this.t = setTimeout(() => this.push(), 4000); },
  async push() { try { await this.doc().set({ json: JSON.stringify(STORE.d), at: new Date().toISOString() }); this.status('Progreso sincronizado'); } catch (e) { this.status('Sin conexión: guardado en el navegador'); } }
};

/* ============ motor del mapa ============ */
const MAP = {
  t: d3.zoomIdentity, k: 1, mode: 'political', listeners: {},
  on(ev, f) { (this.listeners[ev] = this.listeners[ev] || []).push(f); },
  emit(ev, ...a) { (this.listeners[ev] || []).forEach(f => f(...a)); },
  init() {
    const svg = this.svg = d3.select('#map');
    const defs = svg.append('defs');
    defs.append('clipPath').attr('id', 'sphereClip').append('path').attr('d', D.ppath({ type: 'Sphere' }));
    this.gz = svg.append('g');
    const g = this.gz;
    this.gOcean = g.append('path').attr('class', 'ocean').attr('d', D.ppath({ type: 'Sphere' }));
    this.gRelief = g.append('g').attr('clip-path', 'url(#sphereClip)').attr('display', 'none');
    this.gGrat = g.append('path').attr('class', 'grat').attr('d', D.ppath(d3.geoGraticule10()));
    this.gCty = g.append('g');
    this.gPhys = g.append('g').attr('display', 'none');
    this.gSpecial = g.append('g');
    this.gHL = g.append('g');
    this.gMarks = g.append('g');
    this.gLabels = g.append('g');
    this.gTop = g.append('g');
    // relieve: imagen general + teselas de alta resolución
    const P = D.params, sc = P.w / D.W;
    this.gRelief.append('image').attr('href', 'relief/relief_lo.jpg').attr('x', 0).attr('y', 0).attr('width', D.W).attr('height', D.H).attr('preserveAspectRatio', 'none');
    this.tiles = [];
    for (let j = 0; j < 4; j++) for (let i = 0; i < 8; i++) {
      const w = P.tw / sc, hgt = Math.min(P.th, P.h - j * P.th) / sc;
      const im = this.gRelief.append('image').attr('x', i * P.tw / sc).attr('y', j * P.th / sc).attr('width', w + 0.05).attr('height', hgt + 0.05).attr('preserveAspectRatio', 'none');
      this.tiles.push({ im, x0: i * P.tw / sc, y0: j * P.th / sc, x1: i * P.tw / sc + w, y1: j * P.th / sc + hgt, src: `relief/r_${i}_${j}.jpg`, loaded: false });
    }
    // países
    this.cty = this.gCty.selectAll('path').data(D.cfeat).join('path').attr('class', 'cty').attr('d', D.path).attr('data-id', d => d.id);
    this.mk = this.gMarks.selectAll('circle').data(D.tiny).join('circle').attr('class', 'mk').attr('cx', d => d.x).attr('cy', d => d.y).attr('data-id', d => d.id);
    this.paintPolitical();
    // interacción
    const tip = $('#tip');
    const over = (ev, id) => { if (this.hoverEnabled === false) return; this.emit('hover', id, ev); };
    const move = ev => { if (!tip.hidden) { const r = $('#mapwrap').getBoundingClientRect(); let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14; if (x + 250 > r.width) x -= 270; tip.style.left = x + 'px'; tip.style.top = y + 'px'; } };
    const bind = sel => sel.on('pointerenter', (ev, d) => { over(ev, d.id); d3.select(ev.currentTarget).classed('hov', true); })
      .on('pointerleave', (ev) => { d3.select(ev.currentTarget).classed('hov', false); this.emit('hover', null, ev); })
      .on('pointermove', move)
      .on('click', (ev, d) => { if (this._dragged) return; ev.stopPropagation(); this.emit('click', d.id, ev, this.toWorld(ev)); });
    bind(this.cty); bind(this.mk);
    svg.on('pointermove.tip', move);
    svg.on('click.bg', ev => { if (this._dragged) return; this.emit('click', null, ev, this.toWorld(ev)); });
    this.zoom = d3.zoom().scaleExtent([0.2, 200]).on('start', () => { this._dragged = false; }).on('zoom', ev => {
      if (ev.sourceEvent && ev.sourceEvent.type === 'mousemove') this._dragged = true;
      this.t = ev.transform; this.k = ev.transform.k; this.gz.attr('transform', ev.transform); this.onZoom(); this.emit('zoom', ev.transform);
    }).on('end', () => { setTimeout(() => this._dragged = false, 0); this.onZoomEnd(); this.emit('zoomend'); });
    svg.call(this.zoom).on('dblclick.zoom', null);
    $('#zin').onclick = () => svg.transition().duration(300).call(this.zoom.scaleBy, 1.8);
    $('#zout').onclick = () => svg.transition().duration(300).call(this.zoom.scaleBy, 1 / 1.8);
    $('#zhome').onclick = () => this.home();
    new ResizeObserver(debounce(() => this.resize(), 80)).observe($('#mapwrap'));
    this.resize(true);
  },
  toWorld(ev) { const p = d3.pointer(ev, this.svg.node()); return this.t.invert(p); },
  resize(first) {
    const r = $('#mapwrap').getBoundingClientRect(); this.vw = r.width; this.vh = r.height;
    this.fitK = Math.min(this.vw / D.W, this.vh / D.H) * 0.98;
    this.zoom.scaleExtent([this.fitK * 0.8, this.fitK * 120]).translateExtent([[-D.W * 0.25, -D.H * 0.35], [D.W * 1.25, D.H * 1.35]]);
    if (first) this.home(0);
  },
  pad() { const m = isMobile(); const p = $('#panel'); const bottom = m && !p.hidden && !p.classList.contains('collapsed') ? p.getBoundingClientRect().height : 0; return { t: m ? 60 : 56, r: 54, b: bottom + 20, l: 20 }; },
  fit(b, { dur = 750, maxK = 60, minK = 1 } = {}) {
    if (!b || !isFinite(b[0][0])) return;
    const p = this.pad(), w = Math.max(40, this.vw - p.l - p.r), hh = Math.max(40, this.vh - p.t - p.b);
    const bw = Math.max(b[1][0] - b[0][0], 1), bh = Math.max(b[1][1] - b[0][1], 1);
    let k = Math.min(w / bw, hh / bh) * 0.88; k = Math.max(this.fitK * minK, Math.min(k, this.fitK * maxK));
    const cx = (b[0][0] + b[1][0]) / 2, cy = (b[0][1] + b[1][1]) / 2;
    const t = d3.zoomIdentity.translate(p.l + w / 2 - k * cx, p.t + hh / 2 - k * cy).scale(k);
    (dur ? this.svg.transition().duration(dur) : this.svg).call(this.zoom.transform, t);
  },
  home(dur = 600) { this.fit([[0, 0], [D.W, D.H]], { dur, maxK: 1, minK: 0.8 }); },
  rel() { return this.k / this.fitK; },
  onZoom() {
    const k = this.k;
    this.mk.attr('r', 5 / k).attr('display', d => this.mode !== 'physical' && this.mode !== 'physquiz' && d.diag * k < 14 ? null : 'none');
    this.gLabels.attr('font-size', 13 / k).attr('stroke-width', 3 / k);
    this.gTop.attr('font-size', 13 / k).attr('stroke-width', 3 / k);
    if (this.zoomHook) this.zoomHook(k);
  },
  onZoomEnd() {
    if (this.mode === 'physical' || this.mode === 'physquiz') this.loadTiles();
    if (this.layoutHook) this.layoutHook();
  },
  loadTiles() {
    if (this.rel() < 1.6) return;
    const x0 = this.t.invertX(0), x1 = this.t.invertX(this.vw), y0 = this.t.invertY(0), y1 = this.t.invertY(this.vh);
    for (const t of this.tiles) if (!t.loaded && t.x1 > x0 && t.x0 < x1 && t.y1 > y0 && t.y0 < y1) { t.im.attr('href', t.src); t.loaded = true; }
  },
  setMode(mode) {
    this.mode = mode;
    const phys = mode === 'physical' || mode === 'physquiz';
    this.svg.classed('phys', phys);
    this.gRelief.attr('display', phys ? null : 'none');
    this.gPhys.attr('display', phys ? null : 'none');
    this.gGrat.attr('display', phys ? 'none' : null);
    this.gOcean.style('fill', phys ? '#c8d6e0' : null);
    this.mk.attr('display', phys ? 'none' : null);
    if (phys) { this.cty.style('fill', null); this.loadTiles(); }
    else this.paintPolitical();
    this.onZoom();
  },
  paintPolitical() { this.cty.attr('class', 'cty').style('fill', d => `var(--p${D.color[d.id] || 6})`); this.mk.style('fill', d => `var(--p${D.color[d.id] || 6})`).style('stroke', null); },
  paint(fn) { this.cty.style('fill', d => fn(d.id)); this.mk.style('fill', d => fn(d.id)); },
  clearOverlays() { this.gSpecial.selectAll('*').remove(); this.gHL.selectAll('*').remove(); this.gTop.selectAll('*').remove(); },
  /* etiquetas con detección de colisiones en pantalla */
  layoutLabels(sel, opts = {}) {
    const k = this.k, t = this.t, vw = this.vw, vh = this.vh, base = 13;
    const placed = [];
    const items = sel.data().map((d, i) => ({ d, i })).filter(o => (o.d.minK || 0) <= this.rel());
    items.sort((a, b) => (a.d.pri || 0) - (b.d.pri || 0));
    const show = new Set();
    for (const o of items) {
      const d = o.d; const sx = t.applyX(d.x), sy = t.applyY(d.y);
      if (sx < -50 || sx > vw + 50 || sy < -30 || sy > vh + 30) continue;
      const fs = base * (d.em || 1); const w = (d.w || d.text.length * 0.56 * (d.ls ? 1 + d.ls * 1.6 : 1)) * fs, hgt = fs * (d.lines || 1.2);
      let bx;
      if (d.a && Math.abs(d.a) > 8) { const ang = d.a * Math.PI / 180, c = Math.abs(Math.cos(ang)), s = Math.abs(Math.sin(ang)); const W2 = w * c + hgt * s, H2 = w * s + hgt * c; bx = [sx - W2 / 2, sy - H2 / 2, sx + W2 / 2, sy + H2 / 2]; }
      else bx = [sx - w / 2, sy - hgt / 2, sx + w / 2, sy + hgt / 2];
      if (opts.always && opts.always(d)) { placed.push(bx); show.add(o.i); continue; }
      if (placed.some(p => !(bx[2] < p[0] || bx[0] > p[2] || bx[3] < p[1] || bx[1] > p[3]))) continue;
      placed.push(bx); show.add(o.i);
    }
    sel.attr('display', (d, i) => show.has(i) ? null : 'none');
  }
};

/* ============ panel y navegación ============ */
const APP = { tab: null, tabs: {} };
function setPanel(html) { const b = $('#panelBody'); b.innerHTML = html; $('#panel').scrollTop = 0; $('#panel').classList.remove('collapsed'); }
function tooltip(html, ev) {
  const tip = $('#tip'); if (!html) { tip.hidden = true; return; }
  tip.innerHTML = html; tip.hidden = false;
  if (ev && ev.clientX != null) { const r = $('#mapwrap').getBoundingClientRect(); let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14; if (x + 250 > r.width) x -= 270; tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
}
function switchTab(name) {
  if (APP.tab === name) return;
  const prev = APP.tabs[APP.tab]; if (prev && prev.leave) prev.leave();
  APP.tab = name;
  $$('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
  const t = APP.tabs[name];
  const pageMode = !!t.page;
  $('#page').hidden = !pageMode; $('#panel').hidden = pageMode;
  $('#main').style.gridTemplateColumns = pageMode ? '1fr' : '';
  MAP.hoverEnabled = true; MAP.layoutHook = null; MAP.zoomHook = null; MAP.clearOverlays(); MAP.gLabels.selectAll('*').remove(); tooltip(null);
  $('#legend').hidden = true; $('#searchbox').hidden = true;
  t.enter();
  lsSet('atlas-tab', name);
  try { if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name); } catch (e) { }
  setTimeout(() => MAP.resize(), 30);
}
function initShell() {
  $$('.tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  $('#handle').onclick = () => $('#panel').classList.toggle('collapsed');
  const th = $('#themeBtn');
  const applyTheme = v => { if (v) document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme'); };
  applyTheme(lsGet('atlas-theme'));
  th.onclick = () => { const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); const nx = cur === 'dark' ? 'light' : 'dark'; applyTheme(nx); lsSet('atlas-theme', nx); };
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (APP.tabs[h]) switchTab(h); });
  // buscador
  const inp = $('#search'), sg = $('#sugg'); let hits = [], cur = 0;
  const render = () => { sg.hidden = !hits.length; sg.innerHTML = hits.map((h, i) => `<button data-id="${h.id}" class="${i === cur ? 'on' : ''}"><img alt="" src="${flagUrl(h.id)}">${esc(h.name)}<small>${esc(D.info[h.id].state ? (D.info[h.id].reg || '') : 'territorio')}</small></button>`).join(''); };
  inp.oninput = () => {
    const q = norm(inp.value); cur = 0; if (!q) { hits = []; return render(); }
    hits = D.searchIdx.filter(x => !x.id.includes('-') && (x.n.includes(q) || x.alts.some(a => a.startsWith(q)))).sort((a, b) => (b.n.startsWith(q) - a.n.startsWith(q)) || (!!D.info[b.id].state - !!D.info[a.id].state) || a.n.localeCompare(b.n)).slice(0, 8);
    render();
  };
  inp.onkeydown = e => { if (e.key === 'ArrowDown') { cur = Math.min(hits.length - 1, cur + 1); render(); e.preventDefault(); } else if (e.key === 'ArrowUp') { cur = Math.max(0, cur - 1); render(); e.preventDefault(); } else if (e.key === 'Enter' && hits[cur]) { pick(hits[cur].id); } else if (e.key === 'Escape') { hits = []; render(); } };
  sg.onclick = e => { const b = e.target.closest('button'); if (b) pick(b.dataset.id); };
  const pick = id => { hits = []; render(); inp.value = ''; inp.blur(); const t = APP.tabs[APP.tab]; if (t && t.select) t.select(id, true); };
  document.addEventListener('click', e => { if (!e.target.closest('#searchbox')) { hits = []; render(); } });
}

/* ============ EXPLORAR ============ */
const TERR_DISPUTE = { FLK: ['malvinas'], GIB: ['gibraltar'], IOT: ['chagos'], SGS: ['georgias'], 'FRA-MYT': ['mayotte'], 'ESP-CEU': ['ceuta-melilla'], 'ESP-MEL': ['ceuta-melilla'], HKG: [], MAC: [] };
const CENTURIES = [15, 16, 17, 18, 19, 20];
const roman = c => ({ 11: 'XI', 12: 'XII', 13: 'XIII', 14: 'XIV', 15: 'XV', 16: 'XVI', 17: 'XVII', 18: 'XVIII', 19: 'XIX', 20: 'XX', 21: 'XXI' }[c] || c);
const swatch = cls => `<svg class="swatch-line" viewBox="0 0 30 10"><line class="ln ${cls}" x1="2" y1="5" x2="28" y2="5"/></svg>`;
const EXPLORE = {
  sel: null, openDispute: null,
  o: { terr: true, disp: true, chg: true, col: true, labels: true, allDisp: false, fitTerr: false, cents: new Set(CENTURIES) },
  enter() {
    MAP.setMode('political'); $('#legend').hidden = false; $('#searchbox').hidden = false;
    this.legend(); this.countryLabels();
    MAP.layoutHook = () => this.layout();
    if (this.sel) this.select(this.sel, false); else { this.intro(); this.draw(); }
    this.layout();
  },
  leave() { },
  legend() {
    const o = this.o;
    const row = (k, cls, label) => `<label><input type="checkbox" data-k="${k}" ${o[k] ? 'checked' : ''}>${swatch(cls)}<span>${label}</span></label>`;
    $('#legend').innerHTML = `<summary>Leyenda</summary><div class="rows">
      <label style="cursor:default"><span></span>${swatch('ln-sel')}<span>País seleccionado</span></label>
      ${row('terr', 'ln-terr', 'Territorio lejano del mismo país')}
      ${row('disp', 'ln-red', 'Zona en disputa · conflicto activo')}
      <label style="cursor:default"><span></span>${swatch('ln-orange')}<span>Zona en disputa · diplomática</span></label>
      ${row('chg', 'ln-change', 'Cambio de frontera reciente (desde 1990)')}
      ${row('col', 'ln-colony', 'Antigua colonia o territorio que le perteneció')}
      <label><input type="checkbox" data-k="allDisp" ${o.allDisp ? 'checked' : ''}><span></span><span>Ver todas las disputas del mundo</span></label>
      <label><input type="checkbox" data-k="labels" ${o.labels ? 'checked' : ''}><span></span><span>Nombres de países</span></label>
      <label><input type="checkbox" data-k="fitTerr" ${o.fitTerr ? 'checked' : ''}><span></span><span>Encuadrar con todos sus territorios</span></label>
      <div class="note">Las antiguas colonias se marcan solo en la parte que perteneció al país, con límites regionales actuales como aproximación.</div></div>`;
    $$('#legend input[data-k]').forEach(i => i.onchange = () => {
      o[i.dataset.k] = i.checked;
      if (i.dataset.k === 'labels') { MAP.gLabels.attr('display', i.checked ? null : 'none'); return; }
      if (i.dataset.k === 'fitTerr' && this.sel) { this.fly(); return; }
      this.draw(); if (this.sel) this.panel();
    });
    if (isMobile()) $('#legend').open = false;
  },
  countryLabels() {
    const data = Object.entries(D.info).filter(([id, e]) => e.lab && (e.state || e.kind === 'territory') && D.byId[id]).map(([id, e]) => {
      const p = D.proj([e.lab[0], e.lab[1]]); const ml = e.lab[2] || 5;
      return { id, x: p[0], y: p[1], text: e.name, minK: Math.pow(2, ml - 3.2), pri: ml + (e.state ? 0 : 2), em: ml < 3 ? 0.88 : ml < 4 ? 0.8 : 0.74, ls: 0.06 };
    });
    this.lab = MAP.gLabels.selectAll('text.lbl-cty').data(data).join('text').attr('class', 'lbl lbl-cty').attr('x', d => d.x).attr('y', d => d.y).attr('font-size', d => d.em + 'em').text(d => d.text);
    MAP.gLabels.attr('display', this.o.labels ? null : 'none');
  },
  layout() { if (this.lab) MAP.layoutLabels(this.lab); if (this.cityLab) MAP.layoutLabels(this.cityLab, { always: d => d.cap }); },
  hover(id, ev) {
    if (!id) return tooltip(null);
    const e = D.info[id]; if (!e) return tooltip(null);
    const sov = e.kind === 'far' || e.kind === 'territory' ? `<span class="muted small">${e.kind === 'far' ? 'Parte de' : 'Territorio de'} ${esc(nameOf(e.sov))}</span>` : `<span class="muted small">${esc(e.reg || '')}</span>`;
    tooltip(`<b>${esc(e.name)}</b>${sov}`, ev);
  },
  click(id) { if (!id) return; const f = D.byId[id]; const p = f && f.properties || {}; this.select(p.kind === 'far' ? p.sov : id, true); },
  select(id, fly = true) {
    if (!D.info[id]) return;
    this.sel = id; this.openDispute = null; this.panel(); this.draw(); if (fly) this.fly();
  },
  fly() {
    const id = this.sel; let b = homeBounds(id);
    if (this.o.fitTerr) b = unionBounds([id, ...(D.parts[id] || [])]);
    MAP.fit(b, { maxK: 40 });
  },
  disputesFor(id) {
    const all = D.special.disputes;
    if (!id) return [];
    const extra = TERR_DISPUTE[id] || [];
    return all.filter(d => d.parties.includes(id) || extra.includes(d.id) || d.geo.includes('c:' + id));
  },
  changesFor(id) { return id ? D.special.changes.filter(c => c.parties.includes(id) || c.geo.includes('c:' + id)) : []; },
  coloniesFor(id) {
    const list = D.special.colonies[id] || [];
    return list.filter(e => { for (const c of this.o.cents) { const s = (c - 1) * 100, t = c * 100; if (e.a < t && e.b >= s) return true; } return false; });
  },
  draw() {
    MAP.clearOverlays();
    const id = this.sel, o = this.o, gS = MAP.gSpecial, gH = MAP.gHL;
    const P = D.path;
    const lines = (feats, cls, data) => { for (const f of feats) if (f) gS.append('path').attr('class', 'ln ' + cls).attr('d', P(f)); };
    const hit = (feats, info) => { for (const f of feats) if (f) gS.append('path').attr('class', 'fill-hit').attr('d', P(f)).on('pointerenter', ev => tooltip(info, ev)).on('pointermove', ev => tooltip(info, ev)).on('pointerleave', () => tooltip(null)).on('click', ev => { ev.stopPropagation(); }); };
    // colonias
    if (id && o.col) for (const e of this.coloniesFor(id)) { const fs = e.geo.map(geoRef); lines(fs, 'ln-colony'); hit(fs, `<b>${esc(e.n)}</b>${esc(e.t)} · ${e.a}–${e.b}<br><span class="muted">${esc(e.end)}</span>`); }
    // cambios
    if (id && o.chg) for (const c of this.changesFor(id)) { const fs = c.geo.map(geoRef); lines(fs, 'ln-change'); hit(fs, `<b>${esc(c.name)} (${esc(c.year)})</b><span class="muted">${esc(c.why.slice(0, 160))}${c.why.length > 160 ? '…' : ''}</span>`); }
    // disputas
    const ds = o.allDisp ? D.special.disputes : (o.disp ? this.disputesFor(id) : []);
    for (const d of ds) { const fs = d.geo.map(geoRef); lines(fs, d.nivel === 'rojo' ? 'ln-red' : 'ln-orange'); hit(fs, `<b>${esc(d.name)}</b>Entre: ${d.parties.map(nameOf).map(esc).join(' · ')}<br><span class="muted">Control de facto: ${esc(d.control)}</span>`); }
    if (!id) return;
    // territorios del mismo país (misma línea, discontinua)
    const e = D.info[id];
    if (o.terr) for (const t of (D.parts[id] || [])) { const f = D.byId[t]; gH.append('path').attr('class', 'ln ln-terr').attr('d', P(f)); }
    // contorno del país
    const f = D.byId[id];
    gH.append('path').attr('class', 'ln ln-sel-halo').attr('d', P(f));
    gH.append('path').attr('class', 'ln ln-sel').attr('d', P(f));
    if (D.tiny.find(t => t.id === id)) { const t = D.tiny.find(t => t.id === id); gH.append('circle').attr('class', 'ln ln-sel').attr('cx', t.x).attr('cy', t.y).attr('r', 0.9); }
    // ciudades
    this.cities();
  },
  cities() {
    const e = D.info[this.sel]; const g = MAP.gTop; g.selectAll('*').remove(); this.cityLab = null;
    if (!e || !e.cities) return;
    const data = e.cities.map(c => { const p = D.proj([c[1], c[2]]); const cap = c[3] === 1 || c[0] === e.cap; return { x: p[0], y: p[1], text: c[0], cap, pri: cap ? 0 : 1, em: cap ? 1 : 0.9, w: c[0].length * 0.55 + 1.6 }; });
    this.cityLab = g.selectAll('text').data(data).join('text').attr('class', 'lbl lbl-city').attr('x', d => d.x).attr('y', d => d.y).attr('font-size', d => d.em + 'em').style('text-anchor', 'start')
      .html(d => `<tspan class="${d.cap ? 'city-cap' : 'city-dot'}" dx="-0.35em" style="font-size:${d.cap ? 1.2 : 0.8}em">${d.cap ? '★' : '●'}</tspan><tspan dx="0.25em" style="${d.cap ? 'font-weight:700' : ''}">${esc(d.text)}</tspan>`);
    MAP.onZoom(); this.layout();
  },
  intro() {
    const n = D.states.length;
    setPanel(`<div class="stack">
      <div class="eyebrow">Explorar</div><h2>Elige cualquier país</h2>
      <p>Haz clic en el mapa o búscalo arriba. Verás su ficha completa y, sobre el mapa, sus territorios lejanos, zonas en disputa, cambios de frontera recientes y antiguas colonias.</p>
      <p class="muted small">${n} Estados (193 de la ONU, más Ciudad del Vaticano, Palestina, Kosovo y Taiwán) y unos 50 territorios. Los países diminutos tienen un círculo para poder pulsarlos.</p>
      <div class="sec"><h4>Prueba con</h4><div class="chips">${['DNK', 'ESP', 'GBR', 'FRA', 'IND', 'UKR', 'MAR', 'ISR', 'CHN', 'ARG'].map(c => `<button class="chip" data-go="${c}">${esc(nameOf(c))}</button>`).join('')}</div></div>
    </div>`);
    $$('[data-go]').forEach(b => b.onclick = () => this.select(b.dataset.go));
  },
  panel() {
    const id = this.sel, e = D.info[id]; if (!e) return;
    const isState = !!e.state, o = this.o;
    const lvls = ['cap', 'capc', 'mapn', 'mapc', 'flag', 'flagc'].map(m => STORE.level(m + '|' + id));

    const html = `<div class="card stack" style="gap:8px"><div class="eyebrow">${esc(it.c)}</div><h3>${esc(it.n)}</h3>
      ${it.e ? `<div>Altitud: <b class="kv">${nf.format(it.e)} m</b></div>` : ''}
      ${cs.length ? `<div class="small muted">${it.c === 'océano' || it.c === 'mar' ? 'Baña' : 'Se extiende por'} ${cs.length} ${cs.length === 1 ? 'país o territorio' : 'países o territorios'}:</div><div class="chips">${cs.slice(0, 40).map(c => `<button class="chip" data-go="${c}">${esc(nameOf(c))}</button>`).join('')}</div>` : ''}
      <div class="small muted">Importancia: ${it.r <= 1 ? 'muy alta' : it.r <= 3 ? 'alta' : it.r <= 5 ? 'media' : 'local'} (rango ${it.r} de Natural Earth)</div></div>`;
    if (inline) { const old = $('#featCard'); if (old) old.remove(); const d = document.createElement('div'); d.id = 'featCard'; d.innerHTML = html; $('#panelBody .stack').insertBefore(d, $('#panelBody .stack').children[2]); $('#panel').scrollTop = 0; }
    else setPanel(`<div class="stack"><div class="eyebrow">Accidente geográfico</div>${html}${this.sel ? `<button class="btn sm" id="backC">Volver a ${esc(nameOf(this.sel))}</button>` : ''}</div>`);
    $$('[data-go]', $('#panelBody')).forEach(b => b.onclick = () => this.select(b.dataset.go));
    const bk = $('#backC'); if (bk) bk.onclick = () => this.select(this.sel);
  }
};
APP.tabs.fisico = PHYS;

/* ============ PROGRESO ============ */
const POLM = POL_TYPES.map(t => t.m), PHYM = PHY_TYPES.map(t => t.m), CARM = CAR_TYPES.map(t => t.m);
const PROG = {
  page: true, type: 'all', confirm: null,
  enter() { this.render(); },
  refresh() { if (APP.tab === 'progreso') this.render(); },
  lvlOf(id) {
    if (this.type !== 'all') return STORE.level(this.type + '|' + id);
    const ls = POLM.map(m => STORE.level(m + '|' + id)); if (ls.every(l => l === 0)) return 0;
    return Math.round(ls.reduce((a, b) => a + b, 0) / ls.length) || 1;
  },
  counts(keys) { const c = [0, 0, 0, 0]; keys.forEach(k => c[STORE.level(k)]++); return c; },
  render() {
    const items = STORE.d.items; const keys = Object.keys(items);
    const tot = STORE.d.tot; const acc = tot.n ? Math.round(tot.ok / tot.n * 100) : 0;
    const polKeys = D.states.flatMap(id => (this.type === 'all' ? POLM : [this.type]).map(m => m + '|' + id));
    const dom = keys.filter(k => STORE.level(k) === 3).length;
    // barras por región
    const bars = REGIONS.map(r => { const ids = D.states.filter(id => D.info[id].reg === r); const ks = ids.flatMap(id => (this.type === 'all' ? POLM : [this.type]).map(m => m + '|' + id)); const c = this.counts(ks); const n = ks.length; return { r, c, n, pct: n ? Math.round(c[3] / n * 100) : 0 }; });
    // más fallados
    const byC = {}; for (const [k, r] of Object.entries(items)) { const [m, id] = k.split('|'); if (!POLM.includes(m)) continue; const o = byC[id] = byC[id] || { bad: 0, ok: 0, modes: {} }; o.bad += r[4]; o.ok += r[3]; if (r[4]) o.modes[m] = (o.modes[m] || 0) + r[4]; }
    const worst = Object.entries(byC).filter(([id, o]) => o.bad > 0).sort((a, b) => (b[1].bad - b[1].ok * 0.5) - (a[1].bad - a[1].ok * 0.5)).slice(0, 12);
    const phyK = keys.filter(k => PHYM.includes(k.split('|')[0])), carK = keys.filter(k => CARM.includes(k.split('|')[0]));
    const pc = this.counts(phyK), cc = this.counts(carK);
    const physWorst = phyK.filter(k => items[k][4] > items[k][3]).sort((a, b) => items[b][4] - items[a][4]).slice(0, 8);
    const tname = this.type === 'all' ? 'todos los tipos' : POL_TYPES.find(t => t.m === this.type).n;
    const stackBar = c => { const n = c.reduce((a, b) => a + b, 0) || 1; return `<div class="track">${[3, 2, 1, 0].map(l => `<span style="width:${c[l] / n * 100}%;background:${LEVELS[l].c}" title="${LEVELS[l].n}: ${c[l]}"></span>`).join('')}</div>`; };
    $('#page').innerHTML = `<div class="page-inner stack" style="gap:22px">
      <header class="stack" style="gap:6px"><div class="eyebrow">Progreso</div><h2>Lo que ya dominas</h2><p class="muted">La app guarda cada país por tipo de pregunta: saberte la capital de Malí no cuenta como saberte su bandera.</p></header>
      <div class="statrow">
        <div class="card bigstat"><span class="eyebrow">Respuestas</span><b>${nf.format(tot.n)}</b><span class="small muted">${acc} % de aciertos</span></div>
        <div class="card bigstat"><span class="eyebrow">Racha</span><b>${STORE.streak()}</b><span class="small muted">${STORE.streak() === 1 ? 'día seguido' : 'días seguidos'} estudiando</span></div>
        <div class="card bigstat"><span class="eyebrow">Dominados</span><b>${nf.format(dom)}</b><span class="small muted">elementos en total</span></div>
        <div class="card bigstat"><span class="eyebrow">Días de estudio</span><b>${STORE.d.days.length}</b><span class="small muted">desde el principio</span></div>
      </div>
      <div class="card stack">
        <div class="row" style="justify-content:space-between"><h3>Mapa de progreso</h3><select id="ptype" aria-label="Tipo de pregunta" style="padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)"><option value="all">Media de los 6 tipos</option>${POL_TYPES.map(t => `<option value="${t.m}" ${this.type === t.m ? 'selected' : ''}>${t.n}</option>`).join('')}</select></div>
        <div style="overflow:hidden"><svg id="pmap" viewBox="0 0 ${D.W} ${D.H}" style="width:100%;height:auto;display:block"></svg></div>
        <div class="row small">${LEVELS.map(l => `<span class="pill"><span class="dot" style="background:${l.c}"></span>${l.n}</span>`).join('')}<span class="muted">Pasa el ratón por un país para ver su nivel.</span></div>
      </div>
      <div class="grid2">
        <div class="card stack"><h3>Dominado por continente</h3><p class="small muted">${esc(tname)}</p><div class="bars">${bars.map(b => `<div class="barrow"><span>${b.r}</span>${stackBar(b.c)}<span class="num">${b.pct} %</span></div>`).join('')}</div></div>
        <div class="card stack"><h3>Los países que más fallas</h3>${worst.length ? `<ul class="list">${worst.map(([id, o]) => `<li><button data-go="${id}"><span style="width:26px;flex:none;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px var(--line);display:inline-block;line-height:0">${flagSvg(id)}</span><span>${esc(nameOf(id))}<br><span class="small muted">${Object.keys(o.modes).map(m => POL_TYPES.find(t => t.m === m).n).join(' · ')}</span></span><span class="meta">${o.bad} fallos</span></button></li>`).join('')}</ul>` : '<p class="muted small">Todavía no hay fallos registrados. Empieza en la pestaña Examen.</p>'}</div>
      </div>
      <div class="grid2">
        <div class="card stack"><h3>Accidentes geográficos</h3>${stackBar(pc)}<p class="small muted">${pc[3]} dominados, ${pc[2]} repasando, ${pc[1]} aprendiendo.</p>${physWorst.length ? `<div class="small"><b>Más fallados:</b> ${physWorst.map(k => { const [m, id] = k.split('|'); return esc(m === 'ps' ? 'mares de ' + nameOf(id) : (D.pitems[id] || {}).n || id); }).join(', ')}</div>` : ''}</div>
        <div class="card stack"><h3>Cartografía</h3>${stackBar(cc)}<p class="small muted">${cc[3]} dominados, ${cc[2]} repasando, ${cc[1]} aprendiendo.</p></div>
      </div>
      <div class="card stack">
        <h3>Copia de seguridad</h3>
        <p class="small">Tu progreso se guarda en este navegador${REMOTE.ready ? ' y en tu cuenta (privado)' : ''}. Exporta un archivo JSON para no perderlo nunca o para pasarlo a otro dispositivo.</p>
        <div class="row"><button class="btn" id="exp">Exportar progreso</button><label class="btn" style="cursor:pointer">Importar archivo<input type="file" id="impF" accept=".json,application/json" hidden></label><button class="btn" id="expTxt">Ver como texto</button></div>
        <div id="expBox" hidden><textarea id="expTa" aria-label="Progreso en formato JSON"></textarea><div class="row" style="margin-top:6px"><button class="btn sm" id="copyTa">Copiar</button><button class="btn sm" id="impTa">Importar este texto</button></div></div>
        <div class="sec"><h4>Reiniciar</h4><div class="row">${[['all', 'Todo'], ['pol', 'Países'], ['phy', 'Accidentes'], ['car', 'Cartografía']].map(([k, n]) => `<button class="btn sm danger" data-reset="${k}">${n}</button>`).join('')}</div>
        ${this.confirm ? `<div class="confirm"><b>¿Borrar el progreso de ${{ all: 'todo', pol: 'países', phy: 'accidentes', car: 'cartografía' }[this.confirm]}?</b><span class="small">No se puede deshacer. Exporta antes una copia si la quieres conservar.</span><div class="row"><button class="btn sm danger" id="doReset">Sí, borrar</button><button class="btn sm" id="noReset">Cancelar</button></div></div>` : ''}</div>
      </div>
    </div>`;
    this.map();
    const P = $('#page');
    $('#ptype').onchange = e => { this.type = e.target.value; this.render(); };
    $$('[data-go]', P).forEach(b => b.onclick = () => { switchTab('explorar'); EXPLORE.select(b.dataset.go); });
    const json = () => JSON.stringify(STORE.d);
    $('#exp').onclick = async () => {
      const fn = 'atlas-progreso-' + new Date().toISOString().slice(0, 10) + '.json';
      try { const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; if (dl) { await dl.save({ filename: fn, data: json() }); toast('Progreso exportado'); return; } } catch (e) { if (e && e.code === 'declined') return; }
      if (!window.claude) { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json()], { type: 'application/json' })); a.download = fn; document.body.appendChild(a); a.click(); a.remove(); toast('Progreso exportado'); return; } catch (e) { } }
      $('#expBox').hidden = false; $('#expTa').value = json(); toast('Copia el texto para guardarlo');
    };
    $('#expTxt').onclick = () => { $('#expBox').hidden = !$('#expBox').hidden; $('#expTa').value = json(); };
    $('#copyTa').onclick = async () => { const ta = $('#expTa'); try { await navigator.clipboard.writeText(ta.value); toast('Copiado'); } catch (e) { ta.select(); toast('Selecciona y copia con Ctrl+C'); } };
    const imp = txt => { try { const o = JSON.parse(txt); if (!o || !o.items) throw 0; STORE.merge(o); STORE.save(); toast('Progreso importado y combinado'); this.render(); } catch (e) { toast('El archivo no tiene un formato válido'); } };
    $('#impTa').onclick = () => imp($('#expTa').value);
    $('#impF').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => imp(r.result); r.readAsText(f); };
    $$('[data-reset]', P).forEach(b => b.onclick = () => { this.confirm = b.dataset.reset; this.render(); $('.confirm').scrollIntoView({ block: 'center' }); });
    const dr = $('#doReset'); if (dr) dr.onclick = () => { const k = this.confirm; STORE.reset(k === 'all' ? null : (k === 'pol' ? POLM : k === 'phy' ? PHYM : CARM).map(m => m + '|')); this.confirm = null; toast('Progreso borrado'); this.render(); };
    const nr = $('#noReset'); if (nr) nr.onclick = () => { this.confirm = null; this.render(); };
  },
  map() {
    const svg = d3.select('#pmap');
    svg.append('path').attr('d', D.ppath({ type: 'Sphere' })).attr('fill', 'var(--ocean)');
    const feats = D.cfeat.filter(f => f.id !== 'ATA');
    const lv = id => { const b = baseId(id); return D.info[b] && D.info[b].state ? this.lvlOf(b) : -1; };
    svg.append('g').selectAll('path').data(feats).join('path').attr('d', D.path).attr('fill', d => { const l = lv(d.id); return l < 0 ? 'var(--panel2)' : LEVELS[l].c; }).attr('stroke', 'var(--panel)').attr('stroke-width', 0.4)
      .append('title').text(d => { const b = baseId(d.id), l = lv(d.id); return nameOf(b) + (l >= 0 ? ': ' + LEVELS[l].n : ''); });
    svg.append('g').selectAll('circle').data(D.tiny.filter(t => D.info[t.id] && D.info[t.id].state)).join('circle').attr('cx', d => d.x).attr('cy', d => d.y).attr('r', 3.2).attr('fill', d => LEVELS[this.lvlOf(d.id)].c).attr('stroke', 'var(--panel)').attr('stroke-width', .6).append('title').text(d => nameOf(d.id) + ': ' + LEVELS[this.lvlOf(d.id)].n);
  }
};
APP.tabs.progreso = PROG;

/* ============ arranque ============ */
(async function boot() {
  STORE.load();
  try { await loadData(); } catch (e) { $('#loading').textContent = 'No se pudieron cargar los datos del atlas (' + e.message + '). Recarga la página.'; return; }
  initShell(); MAP.init();
  MAP.on('click', (id, ev, w) => { const t = APP.tabs[APP.tab]; if (t && t.click) t.click(id, ev, w); });
  MAP.on('hover', (id, ev) => { const t = APP.tabs[APP.tab]; if (t && t.hover) t.hover(id, ev); else tooltip(null); });
  document.addEventListener('keydown', e => { const t = APP.tabs[APP.tab]; if (t && t.key) t.key(e); });
  APP.refresh = () => { const t = APP.tabs[APP.tab]; if (t && t.refresh) t.refresh(); };
  $('#loading').remove();
  const h = location.hash.slice(1);
  switchTab(APP.tabs[h] ? h : (APP.tabs[lsGet('atlas-tab')] ? lsGet('atlas-tab') : 'explorar'));
  REMOTE.init();
})();

</script>

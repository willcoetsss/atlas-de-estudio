<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Atlas interactivo para estudiar países, capitales, banderas, accidentes geográficos y cartografía.">
<meta name="theme-color" content="#f4f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ultimate Atlas">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:title" content="Ultimate Atlas">
<meta property="og:description" content="Aprende países, capitales, banderas, accidentes geográficos y cartografía.">
<meta property="og:image" content="icons/icon-512.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Ultimate Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600;700&family=Cormorant+Garamond:wght@600&display=swap">
<style>
/* Ultimate Atlas · estilo "achromatic ledger": la interfaz en tinta y grises sobre un papel gris piedra;
   el color queda para los datos (el mapa, el país o la respuesta en juego) y un único azul para lo seleccionado.
   Rejilla: barra lateral 224px · mapa fluido · panel 384px. Un solo hueco (12px) entre bloques y 24px de margen interior. */
:root{
  --ground:#f4f3f1; --surface:#ffffff; --raised:#efeeeb; --active:#e7e6e2;
  --border:#e4e3df; --rule:#efeeeb; --control:#d2d1cc;
  --text:#0a0a0a; --muted:#666462; --faint:#6b6b6b;
  --primary:#141414; --primary-ink:#ffffff;
  --hue:#1d5fbf; --hue-soft:#e3ecf8;
  --positive:#247b50; --negative:#c4242a;
  --pill-positive-bg:#dcfae5; --pill-positive-ink:#04250e;
  --pill-negative-bg:#ffedea; --pill-negative-ink:#831c1e;
  --pill-warning-bg:#fffbeb; --pill-warning-ink:#92400e;
  /* mapa: tintas planas de atlas, poca saturación */
  --ocean:#dde6eb; --ocean-deep:var(--ground); --land-line:#ffffff; --grat:#c9d6dd;
  --p1:#e9e1cf; --p2:#dde4d0; --p3:#ecd9d1; --p4:#d9dfe6; --p5:#ece5c6; --p6:#d3e2dc;
  --sel:var(--hue); --dispute-red:#d0261b; --dispute-orange:#e07a00; --colony:#8b3fb5; --change:#0f8f86;
  /* dominio de cada pregunta: una sola escala del azul */
  --m0:#dedcd7; --m1:#c3d4ee; --m2:#86a9e0; --m3:#4f82d2; --m4:#1d5fbf;
  --shadow-float:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.07);
  --font:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --radius:8px; --radius-c:6px; --gap:12px; --pad:24px; --ctl:36px;
  --nav-w:224px; --panel-w:384px; --logo-filter:none;
  /* nombres antiguos que usa el código */
  --bg:var(--ground); --panel:var(--surface); --panel2:var(--raised); --ink:var(--text); --line:var(--border);
  --accent:var(--primary); --accent-ink:var(--primary-ink); --accent-soft:var(--hue-soft);
  --ok:var(--positive); --bad:var(--negative); --ok-soft:var(--pill-positive-bg); --bad-soft:var(--pill-negative-bg);
  --warn:var(--pill-warning-ink); --warn-soft:var(--pill-warning-bg); --f-mono:var(--font);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0b0b0b; --surface:#141414; --raised:#1d1d1d; --active:#262626;
  --border:#262626; --rule:#1f1f1f; --control:#3d3d3d;
  --text:#f5f5f4; --muted:#a8a6a2; --faint:#949290;
  --primary:#f5f5f4; --primary-ink:#0b0b0b; --hue:#6f9fe8; --hue-soft:#16243a;
  --positive:#4cc584; --negative:#f0606a;
  --pill-positive-bg:#132a1d; --pill-positive-ink:#7fdca6; --pill-negative-bg:#2c1617; --pill-negative-ink:#ff9a9a;
  --pill-warning-bg:#2a2010; --pill-warning-ink:#f2c46b;
  --ocean:#14181b; --ocean-deep:var(--ground); --land-line:#0b0b0b; --grat:#20272c;
  --p1:#3a362d; --p2:#30382d; --p3:#3c302d; --p4:#2e343b; --p5:#3a3627; --p6:#2b3835;
  --dispute-red:#ff5a4d; --dispute-orange:#ffa733; --colony:#c58af0; --change:#39c9bd;
  --m0:#2e2d2b; --m1:#23395a; --m2:#2f5594; --m3:#4a7bd0; --m4:#7aa8f0;
  --shadow-float:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.45); --logo-filter:invert(1); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0b0b0b; --surface:#141414; --raised:#1d1d1d; --active:#262626;
  --border:#262626; --rule:#1f1f1f; --control:#3d3d3d;
  --text:#f5f5f4; --muted:#a8a6a2; --faint:#949290;
  --primary:#f5f5f4; --primary-ink:#0b0b0b; --hue:#6f9fe8; --hue-soft:#16243a;
  --positive:#4cc584; --negative:#f0606a;
  --pill-positive-bg:#132a1d; --pill-positive-ink:#7fdca6; --pill-negative-bg:#2c1617; --pill-negative-ink:#ff9a9a;
  --pill-warning-bg:#2a2010; --pill-warning-ink:#f2c46b;
  --ocean:#14181b; --ocean-deep:var(--ground); --land-line:#0b0b0b; --grat:#20272c;
  --p1:#3a362d; --p2:#30382d; --p3:#3c302d; --p4:#2e343b; --p5:#3a3627; --p6:#2b3835;
  --dispute-red:#ff5a4d; --dispute-orange:#ffa733; --colony:#c58af0; --change:#39c9bd;
  --m0:#2e2d2b; --m1:#23395a; --m2:#2f5594; --m3:#4a7bd0; --m4:#7aa8f0;
  --shadow-float:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.45); --logo-filter:invert(1); color-scheme:dark}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--ground)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--hue);outline-offset:2px}
::selection{background:var(--hue-soft)}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:24px}
h2{font-size:24px}
h3{font-size:16px}
p{margin:0}
.num,.score,.facts dd,.list .meta,.barrow .num,.bigstat b{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- armazón: barra lateral + zona principal ---------- */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%}
.bar{display:flex;flex-direction:column;gap:2px;background:var(--ground);padding:20px 12px 16px max(12px,env(safe-area-inset-left,0px));min-width:0;overflow-y:auto;scrollbar-width:none;position:relative;z-index:20}
.bar::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;white-space:nowrap}
.logo{display:inline-block;height:44px;flex:none;line-height:0}
.logo img{height:100%;width:auto;display:block;filter:var(--logo-filter)}
.logo.big{height:150px}
.bname{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1;letter-spacing:.005em}
.brand small{display:none}
.tabs{display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:var(--radius-c);background:none;color:var(--muted);font-size:14px;font-weight:450;text-align:left;white-space:nowrap}
.tab .ti{width:17px;height:17px;flex:none}
.tab[aria-selected="true"]{background:var(--active);color:var(--text);font-weight:500}
@media (hover:hover){.tab:hover{color:var(--text)}}
.bar-right{margin-top:auto;padding:16px 10px 0}
.sync{font-size:12px;color:var(--muted)}
.main{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w)}
.mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden;contain:strict;background:var(--ocean-deep);border-left:1px solid var(--border)}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.mapstage{position:absolute;inset:0;touch-action:none;contain:strict}
.mapstage.fast #map{position:absolute;will-change:transform;backface-visibility:hidden}
#mapTop{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;will-change:opacity;transition:opacity .18s}
#mapTop.away{opacity:0;transition:none}
#mapTop .mk,#mapTop .plab{pointer-events:auto}
.panel{background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;min-width:0;padding:var(--pad) var(--pad) 32px;padding-right:max(var(--pad),env(safe-area-inset-right,0px));scrollbar-width:thin}
.page{position:absolute;inset:0;overflow-y:auto;background:var(--ground);z-index:5;border-left:1px solid var(--border)}
.page-inner{max-width:1100px;margin:0 auto;padding:32px max(28px,env(safe-area-inset-right,0px)) 64px 28px}
.sheet-handle{display:none}
.main.nopanel{grid-template-columns:1fr}
.main.nopanel .panel{display:none}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px}
.panel-top+.eyebrow{margin-bottom:-8px}

/* ---------- aviso para girar el móvil y pantalla de carga ---------- */
.rotate{display:none}
@media (max-width:600px) and (orientation:portrait){html:not(.allow-portrait) .rotate{display:grid}}
.rotate{position:fixed;inset:0;z-index:100;background:var(--ground);place-items:center;text-align:center;padding:24px max(24px,env(safe-area-inset-left,0px))}
.rotate .in{display:grid;gap:14px;justify-items:center;max-width:320px}
.rotate .phone{color:var(--text);animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
.rotate h2{font-size:22px}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--ground);z-index:30;color:var(--muted)}
.loading .bname{font-size:34px;color:var(--text)}

/* ---------- controles flotantes del mapa ---------- */
.mapctl{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:14px;display:flex;flex-direction:column;z-index:4;background:var(--surface);border:1px solid var(--control);border-radius:var(--radius);box-shadow:var(--shadow-float);overflow:hidden}
.main:not(.nopanel) .mapctl{right:14px}
.mapctl button{width:36px;height:36px;border:0;border-top:1px solid var(--rule);background:var(--surface);font-size:18px;line-height:1;color:var(--text);display:grid;place-items:center}
.mapctl button:first-child{border-top:0}
@media (hover:hover){.mapctl button:hover{background:var(--raised)}}
.mapctl .ptog[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.searchbox{position:absolute;left:14px;top:14px;z-index:4;width:min(320px,calc(100% - 90px))}
.searchbox input{width:100%;height:var(--ctl);padding:0 12px 0 36px;border-radius:var(--radius);border:1px solid var(--control);background:var(--surface);box-shadow:var(--shadow-float);font-size:14px}
.searchbox input::placeholder{color:var(--faint)}
.searchbox input:focus{outline:2px solid var(--hue);outline-offset:-1px}
.searchbox svg{position:absolute;left:12px;top:11px;color:var(--muted)}
.sugg{margin-top:6px;background:var(--surface);border:1px solid var(--control);border-radius:var(--radius);box-shadow:var(--shadow-float);max-height:300px;overflow:auto;padding:4px}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:0 8px;height:36px;border-radius:var(--radius-c)}
.sugg button.on{background:var(--raised)}
@media (hover:hover){.sugg button:hover{background:var(--raised)}}
.sugg img{width:22px;height:16px;object-fit:contain;border-radius:2px}
.sugg small{color:var(--muted);margin-left:auto;font-size:12px}
.legend{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--surface);border:1px solid var(--control);border-radius:var(--radius);box-shadow:var(--shadow-float);font-size:13px;max-width:290px;max-height:calc(100% - 78px);overflow-y:auto;overscroll-behavior:contain}
.legend summary{height:36px;padding:0 12px;cursor:pointer;font-weight:500;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;background:var(--surface);z-index:1}
.legend summary::-webkit-details-marker{display:none}
.legend summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-135deg) translate(-2px,-2px)}
.legend[open] summary::after{transform:rotate(45deg) translate(-2px,-2px)}
.legend .rows{padding:2px 12px 12px;display:grid;gap:2px}
.legend label{display:grid;grid-template-columns:16px 30px 1fr;align-items:center;gap:8px;cursor:pointer;min-height:26px}
.legend input{accent-color:var(--primary);margin:0}
.legend svg{display:block}
.legend .note{color:var(--muted);font-size:12px;line-height:1.4;margin-top:6px}
.tooltip{position:absolute;pointer-events:none;z-index:8;background:var(--surface);border:1px solid var(--control);border-radius:var(--radius-c);box-shadow:var(--shadow-float);padding:6px 10px;font-size:13px;max-width:300px;line-height:1.4}
.tooltip b{display:block;font-weight:600}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--primary);color:var(--primary-ink);padding:8px 14px;border-radius:var(--radius-c);font-size:13px;z-index:9;box-shadow:var(--shadow-float)}
.silo{position:absolute;inset:0;z-index:3;background:var(--ground);display:grid;place-items:center;transition:opacity .35s}
.silo[hidden]{display:none}
.silo svg{width:100%;height:100%;display:block}
.silo .shape{fill:var(--text);stroke:var(--text);stroke-width:.6px;stroke-linejoin:round}
.silo .cap{position:absolute;left:16px;bottom:12px;font-size:12px;color:var(--muted)}

/* ---------- SVG del mapa ---------- */
.ocean{fill:var(--ocean)}
.grat{fill:none;stroke:var(--grat);stroke-width:.5px;vector-effect:non-scaling-stroke}
.cty{stroke:var(--land-line);stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .15s}
.cty.hov{filter:brightness(.95)}
.cty.dim{opacity:.45}
.phys .cty{fill:transparent;stroke:rgba(40,30,20,.32);stroke-width:.7px}
.phys .cty.hov{fill:rgba(255,255,255,.18);filter:none}
.ln{fill:none;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.ln-sel{stroke:var(--sel);stroke-width:2.2px}
.ln-sel-halo{stroke:var(--surface);stroke-width:5px;opacity:.85}
.ln-terr{stroke:var(--sel);stroke-width:2px;stroke-dasharray:7 4}
.ln-red{stroke:var(--dispute-red);stroke-width:2.2px;stroke-dasharray:3 3}
.ln-orange{stroke:var(--dispute-orange);stroke-width:2.2px;stroke-dasharray:3 3}
.ln-colony{stroke:var(--colony);stroke-width:2px;stroke-dasharray:1.5 3.5}
.ln-change{stroke:var(--change);stroke-width:2px;stroke-dasharray:9 3 2 3}
.fill-hit{fill:transparent;stroke:transparent;stroke-width:10px;vector-effect:non-scaling-stroke;pointer-events:all;cursor:help}
.ln-ok{stroke:var(--positive);stroke-width:3px}
.ln-bad{stroke:var(--negative);stroke-width:3px}
.f-ok{fill:var(--positive)!important;fill-opacity:.7}
.f-bad{fill:var(--negative)!important;fill-opacity:.65}
.f-q{fill:var(--sel)!important;fill-opacity:.85}
.mk{stroke:var(--surface);vector-effect:non-scaling-stroke;stroke-width:1.2px;cursor:pointer}
.city-dot{fill:var(--surface);stroke:var(--text);stroke-width:1.2px;vector-effect:non-scaling-stroke}
.city-cap{fill:var(--text);stroke:var(--surface);stroke-width:1px;vector-effect:non-scaling-stroke}
.lbl{font-family:var(--font);paint-order:stroke;stroke:var(--surface);stroke-linejoin:round;fill:var(--text);pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.lbl-cty{font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted);stroke-opacity:.85}
.lbl-city{font-weight:500}
.plab{font-family:var(--serif);font-weight:600;paint-order:stroke;stroke:rgba(255,255,255,.75);stroke-linejoin:round;text-anchor:middle;dominant-baseline:middle;cursor:pointer}
.plab:hover{text-decoration:underline}
.plab.water{font-style:italic;fill:#245a82;stroke:rgba(225,238,246,.85)}
.plab.ocean-l{font-style:italic;letter-spacing:.3em;text-transform:uppercase;fill:#2b5f86;stroke:none;opacity:.85}
.plab.range{font-family:var(--font);font-weight:600;text-transform:uppercase;letter-spacing:.2em;fill:#74431c}
.plab.region{font-family:var(--font);font-weight:500;text-transform:uppercase;letter-spacing:.16em;fill:#80501f;font-style:italic}
.plab.on{fill:#0b2f8a!important;font-weight:700}
.plab.land{fill:#33302b}
.plab.peak{font-family:var(--font);fill:#2e2219;font-size:.92em}
.peak-mk{fill:#2e2219;stroke:#fff;stroke-width:.8px;vector-effect:non-scaling-stroke;cursor:pointer}
.river{fill:none;stroke:#3f86c0;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.river:hover{stroke:#1250a0}
.lake{fill:#9fc6e2;stroke:#3f86c0;stroke-width:.5px;vector-effect:non-scaling-stroke}
.hl-poly{fill:var(--sel);fill-opacity:.16;stroke:var(--sel);stroke-width:2.2px;vector-effect:non-scaling-stroke;pointer-events:none}
.hl-line{fill:none;stroke:#ffde3b;stroke-width:5px;vector-effect:non-scaling-stroke;stroke-linecap:round;pointer-events:none}
.hl-line2{fill:none;stroke:var(--sel);stroke-width:2.2px;vector-effect:non-scaling-stroke;stroke-linecap:round;pointer-events:none}
.hl-pt{fill:#ffde3b;stroke:var(--sel);stroke-width:2.5px;vector-effect:non-scaling-stroke;pointer-events:none}
.click-mk{fill:none;stroke:var(--negative);stroke-width:2.5px;vector-effect:non-scaling-stroke;pointer-events:none}

/* ---------- panel: componentes ---------- */
.eyebrow{font-size:13px;color:var(--muted);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--ctl);border:1px solid var(--control);background:var(--surface);border-radius:var(--radius-c);padding:0 14px;font-weight:500;font-size:14px;white-space:nowrap}
@media (hover:hover){.btn:hover{background:var(--raised)}}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
@media (hover:hover){.btn.primary:hover{background:var(--primary);opacity:.88}}
.btn.danger{color:var(--negative);border-color:var(--control)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.timer{position:relative;overflow:hidden}
.btn.timer::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--primary-ink);opacity:.5;transform-origin:left;animation:tbar var(--dur,2s) linear forwards}
@keyframes tbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.xbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--control);background:var(--surface);border-radius:var(--radius-c);font-size:13px;color:var(--text);white-space:nowrap}
@media (hover:hover){.xbtn:hover{background:var(--raised)}}
.chip{display:inline-flex;align-items:center;height:30px;border:1px solid var(--control);background:var(--surface);border-radius:var(--radius-c);padding:0 10px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
a.chip{color:var(--text);text-decoration:none}
@media (hover:hover){.chip:hover:not([aria-pressed="true"]),a.chip:hover{background:var(--raised)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.flagf{display:block;line-height:0;max-width:100%}
.flagf.inl{display:inline-block;flex:none;vertical-align:middle}
.flagf svg,.flagbox svg{width:100%;height:100%;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.12);border-radius:2px}

/* ---------- examen ---------- */
.qcard{display:grid;gap:16px}

.fb{border-radius:var(--radius);padding:12px 14px;font-size:14px;line-height:1.5}

.score{display:flex;gap:0;font-size:13px;color:var(--muted);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.score span{flex:1;padding:8px 12px;border-left:1px solid var(--border);display:grid;gap:1px}
.score span:first-child{border-left:0}

.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.setup{display:grid;gap:18px}
.setup fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
.setup legend{font-size:13px;font-weight:500;color:var(--text);margin-bottom:8px;padding:0}
.seg{display:inline-flex;background:var(--raised);border-radius:var(--radius);padding:3px;gap:2px}
.seg button{border:0;background:none;height:30px;padding:0 12px;border-radius:var(--radius-c);font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.stack>.seg{justify-self:start}
.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.typegrid label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:13px;cursor:pointer;background:var(--surface);line-height:1.35}

/* ---------- páginas: progreso y cartografía ---------- */
.page-inner>header h1,.page-inner>header h2{font-size:24px}

.bigstat{display:grid;gap:4px;align-content:start}
.bigstat .eyebrow{font-size:13px}
.bigstat b{font-size:30px;line-height:1.1;font-weight:400;letter-spacing:-.01em}
textarea{width:100%;min-height:120px;font-size:12px;border:1px solid var(--control);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:10px}
select{height:32px;padding:0 8px;border-radius:var(--radius-c)!important;border:1px solid var(--control)!important;background:var(--surface)!important}
.confirm{border:1px solid var(--pill-negative-ink);background:var(--pill-negative-bg);color:var(--pill-negative-ink);border-radius:var(--radius);padding:12px 14px;display:grid;gap:8px}
.carto h2{font-size:22px}

.carto p{margin:0;max-width:70ch;line-height:1.55}
.carto .lead{font-size:16px;color:var(--muted);max-width:70ch}
.figure{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:grid;gap:10px;min-width:0}
.figure figcaption{font-size:13px;color:var(--muted);line-height:1.45}
.figure svg,.figure canvas{width:100%;height:auto;display:block;max-width:100%}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.projinfo{display:grid;grid-template-columns:auto 1fr;gap:0 16px;font-size:14px;border-top:1px solid var(--rule)}
.projinfo dt,.projinfo dd{padding:8px 0;border-bottom:1px solid var(--rule)}
.projinfo dt{color:var(--muted)}.projinfo dd{margin:0}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.svgtxt{font-family:var(--font);fill:var(--text)}
.svgmut{font-family:var(--font);fill:var(--muted)}

/* ---------- pantallas medianas: la barra lateral se queda en iconos con su nombre debajo ---------- */
@media (max-width:1179px), (max-height:540px) and (orientation:landscape){

}
/* móvil en horizontal: compacto, todo a un toque */

  .panel{padding-block:12px 18px}

}
/* móvil en vertical (si se elige seguir así): barra superior y panel como hoja inferior */
@media (max-width:820px) and (orientation:portrait){
  :root{--nav-w:0px}
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .bar{flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 16px;gap:4px 10px;border-bottom:1px solid var(--border)}
  .brand{padding:0}
  .brand .logo{height:30px}
  .bname{display:inline;font-size:20px}
  .tabs{flex-direction:row;flex-basis:100%;overflow-x:auto;scrollbar-width:none}

  .split{grid-template-columns:1fr}

.vsrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.vs:active:not(:disabled){background:var(--raised)}

li.ordrow.ok{border-color:var(--positive);background:var(--pill-positive-bg);color:var(--pill-positive-ink)}
li.ordrow.bad{border-color:var(--negative);background:var(--pill-negative-bg);color:var(--pill-negative-ink)}

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

<script>
'use strict';
/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ART = /^(el|la|los|las|the|l)\s+/;
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/['’`´.]/g, '').replace(/[^a-z0-9]+/g, ' ').trim().replace(ART, '');
function lev(a, b) {
  if (a === b) return 0; const m = a.length, n = b.length; if (!m || !n) return m || n;
  let prev = Array.from({ length: n + 1 }, (_, i) => i), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++) { cur[0] = i; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); [prev, cur] = [cur, prev]; }
  return prev[n];
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const uniq = a => [...new Set(a)];
const nf = new Intl.NumberFormat('es-ES');
function fmtPop(m) { if (m == null) return '—'; if (m >= 1) return (m >= 100 ? nf.format(Math.round(m)) : nf.format(+m.toFixed(1))) + ' millones'; return nf.format(Math.round(m * 1e6)) + ' hab.'; }
const fmtArea = a => a ? nf.format(Math.round(a)) + ' km²' : '—';
const verif = s => esc(s).replace(/\s*\(verificar[^)]*\)/g, ' <span class="chk" title="Dato muy reciente o cambiante: compruébalo">verificar</span>');

const now = () => Date.now();
const isSheet = () => matchMedia('(max-width:820px) and (orientation:portrait)').matches;
const isLandPhone = () => matchMedia('(max-height:540px) and (orientation:landscape)').matches;

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
const REF_DATE = 'junio de 2026';
const REGIONS = ['Europa', 'África', 'Asia', 'América del Norte', 'Centroamérica y Caribe', 'América del Sur', 'Oceanía'];

/* ============ datos ============ */
const D = {};
async function loadData() {
  const get = p => fetch(p).then(r => { if (!r.ok) throw new Error('No se pudo cargar ' + p); return r.json(); });
  const [params, world, info, flags, special, phys, physGeo, sphere] = await Promise.all(
    ['params', 'world', 'info', 'flags', 'special', 'phys', 'phys_geo', 'sphere110'].map(n => get('data/' + n + '.json')));
  Object.assign(D, { params, world, info, flags, special, phys, physGeo, sphere });
  D.W = params.W; D.H = params.H;
  D.proj = d3.geoEqualEarth().scale(params.S).translate([D.W / 2, D.H / 2]);
  D.path = d3.geoPath();               // geometrías ya proyectadas
  D.ppath = d3.geoPath(D.proj);        // geometrías en lon/lat
  D.cfeat = topojson.feature(world, world.objects.countries).features;
  D.byId = Object.fromEntries(D.cfeat.map(f => [f.id, f]));
  D.extra = Object.fromEntries(topojson.feature(world, world.objects.extra).features.map(f => [f.id, f]));
  D.states = Object.keys(info).filter(id => info[id].state).sort((a, b) => info[a].name.localeCompare(info[b].name, 'es'));
  // partes de cada país: principal + lejanas + territorios
  D.parts = {};
  for (const f of D.cfeat) { const p = f.properties || {}; if (p.kind === 'far' || p.kind === 'territory') (D.parts[p.sov] = D.parts[p.sov] || []).push(f.id); }
  // colores políticos (coloreado voraz por vecindad)
  const geoms = world.objects.countries.geometries, nb = topojson.neighbors(geoms);
  const col = {}; const order = D.cfeat.map((f, i) => i).sort((a, b) => D.path.area(D.cfeat[b]) - D.path.area(D.cfeat[a]));
  for (const i of order) { const f = D.cfeat[i], p = f.properties || {}; if (p.kind === 'far' || p.kind === 'territory') continue; const used = new Set(nb[i].map(j => col[D.cfeat[j].id])); let c = 1; while (used.has(c) && c < 6) c++; col[f.id] = c; }
  for (const f of D.cfeat) { const p = f.properties || {}; if (!col[f.id]) col[f.id] = col[p.sov] || 6; }
  D.color = col;
  // bounding boxes y diminutos
  D.bbox = {}; D.tiny = [];
  for (const f of D.cfeat) { const b = D.path.bounds(f); D.bbox[f.id] = b; const diag = Math.hypot(b[1][0] - b[0][0], b[1][1] - b[0][1]); f.diag = diag; }
  D.tinySet = new Set();
  for (const f of D.cfeat) { if (f.diag < 7 && f.id !== 'ATA') { const i = info[f.id]; const lab = i && i.lab ? D.proj([i.lab[0], i.lab[1]]) : D.path.centroid(largestPoly(f)); D.tiny.push({ id: f.id, x: lab[0], y: lab[1], diag: f.diag }); D.tinySet.add(f.id); } }
  // índice de nombres para búsqueda
  D.searchIdx = Object.entries(info).filter(([id, e]) => !id.includes('-') || true).map(([id, e]) => ({ id, name: e.name, n: norm(e.name), alts: uniq((e.alts || []).map(norm)) }));
  // físico
  D.pitems = phys.items; D.pidx = phys.idx;
  D.pgeo = {};
  for (const o of ['marine', 'regions', 'lakes', 'rivers']) for (const f of topojson.feature(physGeo, physGeo.objects[o]).features) D.pgeo[f.id] = f;
  D.pRev = {}; // rasgo -> países
  for (const [cid, list] of Object.entries(D.pidx)) { const sov = baseId(cid); for (const fid of list) (D.pRev[fid] = D.pRev[fid] || new Set()).add(sov); }
}
function largestPoly(f) {
  const g = f.geometry; if (!g || g.type !== 'MultiPolygon') return f;
  let best = null, ba = -1; for (const c of g.coordinates) { const p = { type: 'Polygon', coordinates: c }; const a = D.path.area(p); if (a > ba) { ba = a; best = p; } } return best;
}
function baseId(id) { const f = D.byId[id]; const p = f && f.properties || {}; if (p.kind === 'far') return p.sov; return id; }
function geoRef(ref) { if (ref.startsWith('c:')) return D.byId[ref.slice(2)]; return D.extra[ref]; }
function flagSvg(id) { const e = D.info[id]; return e && e.iso2 && D.flags[e.iso2] ? D.flags[e.iso2] : '<svg viewBox="0 0 4 3"><rect width="4" height="3" fill="#ccc"/></svg>'; }
const _fr = {};
function flagRatio(id) { const e = D.info[id]; const k = e && e.iso2; if (!k || !D.flags[k]) return 4 / 3; if (_fr[k]) return _fr[k]; const m = D.flags[k].match(/viewBox="([^"]+)"/); let r = 4 / 3; if (m) { const v = m[1].trim().split(/[\s,]+/).map(Number); if (v[2] > 0 && v[3] > 0) r = v[2] / v[3]; } return (_fr[k] = r); }
function flagBox(id, h, cls = '') { const r = flagRatio(id); return `<span class="flagf ${cls}" style="aspect-ratio:${r.toFixed(4)};width:min(100%,${Math.round(h * r)}px)">${flagSvg(id)}</span>`; }
function flagUrl(id) { const s = flagSvg(id); return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); }
function nameOf(id) { const e = D.info[id]; return e ? e.name : id; }
function unionBounds(ids) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const id of ids) { const b = D.bbox[id]; if (!b) continue; x0 = Math.min(x0, b[0][0]); y0 = Math.min(y0, b[0][1]); x1 = Math.max(x1, b[1][0]); y1 = Math.max(y1, b[1][1]); }
  return [[x0, y0], [x1, y1]];
}
function boundsOf(feats) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const f of feats) { if (!f) continue; const b = D.path.bounds(f); if (!isFinite(b[0][0])) continue; x0 = Math.min(x0, b[0][0]); y0 = Math.min(y0, b[0][1]); x1 = Math.max(x1, b[1][0]); y1 = Math.max(y1, b[1][1]); }

}
/* encuadre del país "propio" (sin territorios muy lejanos que distorsionan) */
function homeBounds(id) {
  const f = D.byId[id]; if (!f) return null;
  if (f.geometry && f.geometry.type === 'MultiPolygon') {
    // descarta islas muy lejanas y diminutas respecto del polígono mayor
    const polys = f.geometry.coordinates.map(c => ({ type: 'Polygon', coordinates: c })).map(p => ({ p, a: D.path.area(p), c: D.path.centroid(p) }));
    const big = polys.reduce((a, b) => a.a > b.a ? a : b);
    const keep = polys.filter(q => q.a > big.a * 0.02 || Math.hypot(q.c[0] - big.c[0], q.c[1] - big.c[1]) < 60);
    return boundsOf(keep.map(q => q.p));
  }
  return D.bbox[id];
}

/* ============ contornos detallados (1:10m), solo para las siluetas ============ */
// El mapa grande usa siempre los contornos ligeros, para que vaya fluido. Las preguntas que muestran un país
// aislado cargan su versión detallada (data/hd/<id>.json) y la guardan para la próxima vez.
const HD = {
  geo: {}, prom: {},
  load(id) {
    if (this.geo[id]) return Promise.resolve(this.geo[id]);
    if (this.prom[id]) return this.prom[id];
    return this.prom[id] = fetch('data/hd/' + id + '.json').then(r => r.ok ? r.json() : null).then(t => {
      if (!t) return null; const f = topojson.feature(t, t.objects.c); const g = f.geometry || (f.features && f.features[0] && f.features[0].geometry); return (this.geo[id] = g || null);
    }).catch(() => null);
  },
  async best(id) { await this.load(id); return this.geo[id] || D.byId[id].geometry; }
};

/* ============ memoria de aprendizaje (repetición espaciada) ============ */
const INTERVALS_MIN = [1, 10, 60 * 24, 60 * 24 * 3, 60 * 24 * 8, 60 * 24 * 21, 60 * 24 * 60];
const LEVELS = [{ n: 'Nuevo', c: 'var(--m0)' }, { n: 'Aprendiendo', c: 'var(--m1)' }, { n: 'Repasando', c: 'var(--m2)' }, { n: 'Dominado', c: 'var(--m4)' }];
const STORE = {
  key: 'atlas-estudio-v1',
  d: { v: 1, items: {}, days: [], tot: { n: 0, ok: 0 }, set: {} },
  load() { const s = lsGet(this.key); if (s) { try { const x = JSON.parse(s); if (x && x.items) this.d = Object.assign(this.d, x); } catch (e) { } } },
  saveLocal() { lsSet(this.key, JSON.stringify(this.d)); },
  save() { this.saveLocal(); REMOTE.schedule(); },
  rec(key) { return this.d.items[key]; },
  // r = [caja, vence(min), vistas, aciertos, fallos, tiempoMedio(ds), última(min)]
  grade(key, q, ms) {
    const t = Math.floor(now() / 60000);
    const r = this.d.items[key] || [0, 0, 0, 0, 0, 0, 0];
    r[2]++; r[6] = t; r[5] = Math.round(((r[5] * (r[2] - 1)) + Math.min(ms, 60000) / 100) / r[2]);
    if (q === 0) { r[4]++; r[0] = Math.max(0, r[0] - 2); r[1] = t + 1; }
    else {
      r[3]++;
      if (q === 1) { r[0] = Math.max(1, r[0]); r[1] = t + Math.max(1, Math.round(INTERVALS_MIN[r[0]] * 0.4)); }
      else { r[0] = Math.min(6, r[0] + (q === 3 && r[0] >= 1 ? 2 : 1)); r[1] = t + INTERVALS_MIN[r[0]]; }
    }
    this.d.items[key] = r;
    this.d.tot.n++; if (q > 0) this.d.tot.ok++;
    const day = new Date().toISOString().slice(0, 10); if (!this.d.days.includes(day)) this.d.days.push(day);
    this.save();
    return r;
  },
  level(key) { const r = this.d.items[key]; if (!r || !r[2]) return 0; if (r[0] <= 1) return 1; if (r[0] <= 3) return 2; return 3; },
  weight(key, tmin) {
    const r = this.d.items[key];
    if (!r || !r[2]) return 1.0;                                   // nuevo
    const due = r[1] <= tmin;
    if (due) { const iv = INTERVALS_MIN[r[0]] || 1; return 3 + Math.min(3, (tmin - r[1]) / iv) + (r[4] > r[3] ? 1 : 0); }
    return 0.06 / (r[0] + 1) + (r[0] <= 1 ? 0.25 : 0);              // dominado: aparece de vez en cuando
  },
  pick(keys, avoid = []) {
    const tmin = Math.floor(now() / 60000);
    const learning = keys.filter(k => { const r = this.d.items[k]; return r && r[2] && r[0] <= 1; }).length;
    let tot = 0; const w = keys.map(k => { let x = avoid.includes(k) ? 0 : this.weight(k, tmin); if (!this.d.items[k] && learning >= 10) x *= 0.25; tot += x; return x; });
    if (tot <= 0) return keys[Math.random() * keys.length | 0];
    let r = Math.random() * tot; for (let i = 0; i < keys.length; i++) { r -= w[i]; if (r <= 0) return keys[i]; }
    return keys[keys.length - 1];
  },
  streak() {
    const set = new Set(this.d.days); let s = 0; const d = new Date();
    if (!set.has(d.toISOString().slice(0, 10))) d.setDate(d.getDate() - 1);
    while (set.has(d.toISOString().slice(0, 10))) { s++; d.setDate(d.getDate() - 1); }
    return s;
  },
  merge(o) {
    if (!o || !o.items) return;
    for (const [k, r] of Object.entries(o.items)) { const m = this.d.items[k]; if (!m || (r[6] || 0) > (m[6] || 0) || (r[2] > m[2] && (r[6] || 0) >= (m[6] || 0))) this.d.items[k] = r; }
    this.d.days = uniq([...(this.d.days || []), ...(o.days || [])]).sort();
    if (o.tot && o.tot.n > this.d.tot.n) this.d.tot = o.tot;
  },
  reset(prefixes) {
    if (!prefixes) { this.d.items = {}; this.d.days = []; this.d.tot = { n: 0, ok: 0 }; }
    else for (const k of Object.keys(this.d.items)) if (prefixes.some(p => k.startsWith(p))) delete this.d.items[k];
    this.save();
  }
};
/* copia en la nube privada del usuario (capacidad db), además del navegador */
const REMOTE = {
  db: null, uid: null, ready: false, t: null,
  async init() {
    try {
      if (!window.claude || !window.claude.use) return this.status('Progreso guardado en este navegador');
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return this.status('Progreso guardado en este navegador');
      const uid = await user.id(); if (!uid) return this.status('Progreso guardado en este navegador');
      this.db = db; this.uid = uid;
      const snap = await this.doc().get();
      if (snap.exists) { const v = snap.data(); STORE.merge(v && v.json ? JSON.parse(v.json) : null); STORE.saveLocal(); APP.refresh && APP.refresh(); }
      this.ready = true; this.status('Progreso sincronizado');
    } catch (e) { this.status('Progreso guardado en este navegador'); }
  },
  doc() { return this.db.doc('data/users/' + this.uid + '/atlas/progreso'); },
  status(t) { const s = $('#sync'); if (s) s.textContent = t; },
  schedule() { if (!this.ready) return; clearTimeout(this.t); this.t = setTimeout(() => this.push(), 4000); },
  async push() { try { await this.doc().set({ json: JSON.stringify(STORE.d), at: new Date().toISOString() }); this.status('Progreso sincronizado'); } catch (e) { this.status('Sin conexión: guardado en el navegador'); } }
};

/* ============ motor del mapa ============ */
const MAP = {
  t: d3.zoomIdentity, k: 1, mode: 'political', listeners: {},
  on(ev, f) { (this.listeners[ev] = this.listeners[ev] || []).push(f); },
  emit(ev, ...a) { (this.listeners[ev] || []).forEach(f => f(...a)); },
  init() {
    const svg = this.svg = d3.select('#map');
    // En pantallas táctiles el mapa se mueve como una imagen ya pintada mientras dura el gesto o la animación
    // (lo hace la tarjeta gráfica) y solo se vuelve a dibujar, nítido, al terminar. Así no va a tirones.
    this.fast = matchMedia('(pointer: coarse)').matches;
    const stage = document.createElement('div'); stage.className = 'mapstage' + (this.fast ? ' fast' : '');
    svg.node().parentNode.insertBefore(stage, svg.node()); stage.appendChild(svg.node());
    this.stage = d3.select(stage); this.tc = d3.zoomIdentity; this.ox = 0; this.oy = 0;
    const defs = svg.append('defs');
    defs.append('clipPath').attr('id', 'sphereClip').append('path').attr('d', D.ppath({ type: 'Sphere' }));
    this.gz = svg.append('g');
    const g = this.gz;
    this.gOcean = g.append('path').attr('class', 'ocean').attr('d', D.ppath({ type: 'Sphere' }));
    this.gRelief = g.append('g').attr('clip-path', 'url(#sphereClip)').attr('display', 'none');
    this.gGrat = g.append('path').attr('class', 'grat').attr('d', D.ppath(d3.geoGraticule10()));
    this.gCty = g.append('g');
    this.gPhys = g.append('g').attr('display', 'none');
    this.gSpecial = g.append('g');
    this.gHL = g.append('g');
    // nombres y círculos de países pequeños en una capa aparte, que se oculta mientras el mapa se mueve
    const top = this.svgTop = d3.select(stage).append('svg').attr('id', 'mapTop').attr('aria-hidden', 'true');
    this.gz2 = top.append('g');
    this.gMarks = this.gz2.append('g');
    this.gLabels = this.gz2.append('g');
    this.gTop = this.gz2.append('g');
    // relieve: imagen general + teselas de alta resolución
    const P = D.params, sc = P.w / D.W;
    this.gRelief.append('image').attr('href', 'relief/relief_lo.jpg').attr('x', 0).attr('y', 0).attr('width', D.W).attr('height', D.H).attr('preserveAspectRatio', 'none');
    this.tiles = [];
    for (let j = 0; j < 4; j++) for (let i = 0; i < 8; i++) {
      const w = P.tw / sc, hgt = Math.min(P.th, P.h - j * P.th) / sc;
      const im = this.gRelief.append('image').attr('x', i * P.tw / sc).attr('y', j * P.th / sc).attr('width', w + 0.05).attr('height', hgt + 0.05).attr('preserveAspectRatio', 'none');
      this.tiles.push({ im, x0: i * P.tw / sc, y0: j * P.th / sc, x1: i * P.tw / sc + w, y1: j * P.th / sc + hgt, src: `relief/r_${i}_${j}.jpg`, loaded: false });
    }
    // países
    this.cty = this.gCty.selectAll('path').data(D.cfeat).join('path').attr('class', 'cty').attr('d', D.path).attr('data-id', d => d.id);
    this.mk = this.gMarks.selectAll('circle').data(D.tiny).join('circle').attr('class', 'mk').attr('cx', d => d.x).attr('cy', d => d.y).attr('data-id', d => d.id);
    this.paintPolitical();
    // interacción
    const tip = $('#tip');

/* ============ panel y navegación ============ */
const APP = { tab: null, tabs: {} };
function setPanel(html) { const b = $('#panelBody'); b.innerHTML = html; $('#panel').scrollTop = 0; if (APP.syncTog) APP.syncTog(); }
function tooltip(html, ev) {
  const tip = $('#tip'); if (!html) { tip.hidden = true; return; }
  tip.innerHTML = html; tip.hidden = false;
  if (ev && ev.clientX != null) { const r = $('#mapwrap').getBoundingClientRect(); let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14; if (x + 250 > r.width) x -= 270; tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
}
function switchTab(name) {
  if (APP.tab === name) return;
  const prev = APP.tabs[APP.tab]; if (prev && prev.leave) prev.leave();
  APP.tab = name;
  $$('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
  const t = APP.tabs[name];
  const pageMode = !!t.page;
  $('#page').hidden = !pageMode; $('#panel').hidden = pageMode;
  $('#main').style.gridTemplateColumns = pageMode ? '1fr' : '';
  MAP.hoverEnabled = true; MAP.layoutHook = null; MAP.zoomHook = null; MAP.clearOverlays(); MAP.gLabels.selectAll('*').remove(); tooltip(null);
  $('#legend').hidden = true; $('#searchbox').hidden = true;
  t.enter();
  lsSet('atlas-tab', name);
  try { if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name); } catch (e) { }
  setTimeout(() => MAP.resize(), 30);
}
function applyTheme(v) { if (v) document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme'); }
function setTheme(v) { applyTheme(v); try { if (v) localStorage.setItem('atlas-theme', v); else localStorage.removeItem('atlas-theme'); } catch (e) { } }
function initShell() {
  // en táctil se cambia de pestaña al levantar el dedo, aunque se haya movido un poco (antes se perdían toques)
  $$('.tab').forEach(b => {
    b.onclick = () => switchTab(b.dataset.tab);
    let p0 = null;
    b.addEventListener('pointerdown', e => { p0 = e.pointerType === 'mouse' ? null : [e.clientX, e.clientY]; });
    b.addEventListener('pointerup', e => { if (p0 && Math.hypot(e.clientX - p0[0], e.clientY - p0[1]) < 24) switchTab(b.dataset.tab); p0 = null; });
  });
  // leyenda: abrir y cerrar a mano (más fiable que el comportamiento nativo de <details> en Safari)
  const lg = $('#legend');
  lg.addEventListener('click', e => { if (e.target.closest('summary')) { e.preventDefault(); lg.open = !lg.open; } });
  $('#handle').onclick = () => $('#panel').classList.toggle('collapsed');
  const ptog = $('#ptog');
  const syncTog = () => ptog.setAttribute('aria-pressed', isSheet() ? $('#panel').classList.contains('collapsed') : $('#main').classList.contains('nopanel'));
  ptog.onclick = () => { if (isSheet()) $('#panel').classList.toggle('collapsed'); else $('#main').classList.toggle('nopanel'); syncTog(); setTimeout(() => MAP.resize(), 40); };
  APP.syncTog = syncTog;
  try { if (sessionStorage.getItem('atlas-portrait')) document.documentElement.classList.add('allow-portrait'); } catch (e) { }
  $('#keepPortrait').onclick = () => { document.documentElement.classList.add('allow-portrait'); try { sessionStorage.setItem('atlas-portrait', '1'); } catch (e) { } setTimeout(() => { MAP.resize(); MAP.home(0); }, 40); };
  const fs = $('#fsLand');
  if (document.fullscreenEnabled && screen.orientation && screen.orientation.lock) fs.hidden = false;
  fs.onclick = async () => { try { await document.documentElement.requestFullscreen(); await screen.orientation.lock('landscape'); } catch (e) { toast('Tu navegador no deja girar la pantalla: gira el móvil a mano'); } };
  applyTheme(lsGet('atlas-theme'));
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (APP.tabs[h]) switchTab(h); });
  // buscador
  const inp = $('#search'), sg = $('#sugg'); let hits = [], cur = 0;
  const render = () => { sg.hidden = !hits.length; sg.innerHTML = hits.map((h, i) => `<button data-id="${h.id}" class="${i === cur ? 'on' : ''}"><img alt="" src="${flagUrl(h.id)}">${esc(h.name)}<small>${esc(D.info[h.id].state ? (D.info[h.id].reg || '') : 'territorio')}</small></button>`).join(''); };
  inp.oninput = () => {
    const q = norm(inp.value); cur = 0; if (!q) { hits = []; return render(); }
    hits = D.searchIdx.filter(x => !x.id.includes('-') && (x.n.includes(q) || x.alts.some(a => a.startsWith(q)))).sort((a, b) => (b.n.startsWith(q) - a.n.startsWith(q)) || (!!D.info[b.id].state - !!D.info[a.id].state) || a.n.localeCompare(b.n)).slice(0, 8);
    render();
  };
  inp.onkeydown = e => { if (e.key === 'ArrowDown') { cur = Math.min(hits.length - 1, cur + 1); render(); e.preventDefault(); } else if (e.key === 'ArrowUp') { cur = Math.max(0, cur - 1); render(); e.preventDefault(); } else if (e.key === 'Enter' && hits[cur]) { pick(hits[cur].id); } else if (e.key === 'Escape') { hits = []; render(); } };
  sg.onclick = e => { const b = e.target.closest('button'); if (b) pick(b.dataset.id); };
  const pick = id => { hits = []; render(); inp.value = ''; inp.blur(); const t = APP.tabs[APP.tab]; if (t && t.select) t.select(id, true); };
  document.addEventListener('click', e => { if (!e.target.closest('#searchbox')) { hits = []; render(); } });
}

/* ============ EXPLORAR ============ */
const TERR_DISPUTE = { FLK: ['malvinas'], GIB: ['gibraltar'], IOT: ['chagos'], SGS: ['georgias'], 'FRA-MYT': ['mayotte'], 'ESP-CEU': ['ceuta-melilla'], 'ESP-MEL': ['ceuta-melilla'], HKG: [], MAC: [] };

const EXPLORE = {
  sel: null, openDispute: null,
  o: { terr: true, disp: true, chg: true, col: true, labels: true, allDisp: false, fitTerr: false, cents: new Set(CENTURIES) },
  enter() {

    this.layout();
  },
  leave() { },
  legend() {
    const o = this.o;
    const row = (k, cls, label) => `<label><input type="checkbox" data-k="${k}" ${o[k] ? 'checked' : ''}>${swatch(cls)}<span>${label}</span></label>`;
    $('#legend').innerHTML = `<summary>Leyenda</summary><div class="rows">
      <label style="cursor:default"><span></span>${swatch('ln-sel')}<span>País seleccionado</span></label>
      ${row('terr', 'ln-terr', 'Territorio lejano del mismo país')}
      ${row('disp', 'ln-red', 'Zona en disputa · conflicto activo')}
      <label style="cursor:default"><span></span>${swatch('ln-orange')}<span>Zona en disputa · diplomática</span></label>
      ${row('chg', 'ln-change', 'Cambio de frontera reciente (desde 1990)')}
      ${row('col', 'ln-colony', 'Antigua colonia o territorio que le perteneció')}
      <label><input type="checkbox" data-k="allDisp" ${o.allDisp ? 'checked' : ''}><span></span><span>Ver todas las disputas del mundo</span></label>
      <label><input type="checkbox" data-k="labels" ${o.labels ? 'checked' : ''}><span></span><span>Nombres de países</span></label>
      <label><input type="checkbox" data-k="fitTerr" ${o.fitTerr ? 'checked' : ''}><span></span><span>Encuadrar con todos sus territorios</span></label>

    $$('#legend input[data-k]').forEach(i => i.onchange = () => {

  },

    if (!id) { if (this.sel) this.deselect(); return; }
    const f = D.byId[id]; const p = f && f.properties || {}; this.select(p.kind === 'far' ? p.sov : id, true); },
  deselect() { this.sel = null; this.openDispute = null; tooltip(null); this.intro(); this.draw(); this.layout(); },
  key(e) { if (e.key === 'Escape' && this.sel && !(e.target && e.target.tagName === 'INPUT')) this.deselect(); },
  select(id, fly = true) {
    if (!D.info[id]) return;
    this.sel = id; this.openDispute = null; this.panel(); this.draw(); if (fly) this.fly();
  },
  fly() {
    const id = this.sel; let b = homeBounds(id);
    if (this.o.fitTerr) b = unionBounds([id, ...(D.parts[id] || [])]);
    MAP.fit(b, { maxK: 40 });
  },
  disputesFor(id) {
    const all = D.special.disputes;
    if (!id) return [];
    const extra = TERR_DISPUTE[id] || [];
    return all.filter(d => d.parties.includes(id) || extra.includes(d.id) || d.geo.includes('c:' + id));
  },
  changesFor(id) { return id ? D.special.changes.filter(c => c.parties.includes(id) || c.geo.includes('c:' + id)) : []; },
  coloniesFor(id) {
    const list = D.special.colonies[id] || [];
    return list.filter(e => { for (const c of this.o.cents) { const s = (c - 1) * 100, t = c * 100; if (e.a < t && e.b >= s) return true; } return false; });
  },
  draw() {
    MAP.clearOverlays();
    const id = this.sel, o = this.o, gS = MAP.gSpecial, gH = MAP.gHL;
    const P = D.path;
    const lines = (feats, cls, data) => { for (const f of feats) if (f) gS.append('path').attr('class', 'ln ' + cls).attr('d', P(f)); };
    const hit = (feats, info) => { for (const f of feats) if (f) gS.append('path').attr('class', 'fill-hit').attr('d', P(f)).on('pointerenter', ev => tooltip(info, ev)).on('pointermove', ev => tooltip(info, ev)).on('pointerleave', () => tooltip(null)).on('click', ev => { ev.stopPropagation(); }); };
    // colonias
    if (id && o.col) for (const e of this.coloniesFor(id)) { const fs = e.geo.map(geoRef); lines(fs, 'ln-colony'); hit(fs, `<b>${esc(e.n)}</b>${esc(e.t)} · ${e.a}–${e.b}<br><span class="muted">${esc(e.end)}</span>`); }
    // cambios
    if (id && o.chg) for (const c of this.changesFor(id)) { const fs = c.geo.map(geoRef); lines(fs, 'ln-change'); hit(fs, `<b>${esc(c.name)} (${esc(c.year)})</b><span class="muted">${esc(c.why.slice(0, 160))}${c.why.length > 160 ? '…' : ''}</span>`); }
    // disputas
    const ds = o.allDisp ? D.special.disputes : (o.disp ? this.disputesFor(id) : []);
    for (const d of ds) { const fs = d.geo.map(geoRef); lines(fs, d.nivel === 'rojo' ? 'ln-red' : 'ln-orange'); hit(fs, `<b>${esc(d.name)}</b>Entre: ${d.parties.map(nameOf).map(esc).join(' · ')}<br><span class="muted">Control de facto: ${esc(d.control)}</span>`); }
    if (!id) return;

/* ============ PROGRESO ============ */

  },
  counts(keys) { const c = [0, 0, 0, 0]; keys.forEach(k => c[STORE.level(k)]++); return c; },

    // más fallados
    const byC = {}; for (const [k, r] of Object.entries(items)) { const [m, id] = k.split('|'); if (!POLM.includes(m)) continue; const o = byC[id] = byC[id] || { bad: 0, ok: 0, modes: {} }; o.bad += r[4]; o.ok += r[3]; if (r[4]) o.modes[m] = (o.modes[m] || 0) + r[4]; }
    const worst = Object.entries(byC).filter(([id, o]) => o.bad > 0).sort((a, b) => (b[1].bad - b[1].ok * 0.5) - (a[1].bad - a[1].ok * 0.5)).slice(0, 12);
    const phyK = keys.filter(k => PHYM.includes(k.split('|')[0])), carK = keys.filter(k => CARM.includes(k.split('|')[0]));
    const pc = this.counts(phyK), cc = this.counts(carK);
    const physWorst = phyK.filter(k => items[k][4] > items[k][3]).sort((a, b) => items[b][4] - items[a][4]).slice(0, 8);
    const tname = this.type === 'all' ? 'todos los tipos' : POL_TYPES.find(t => t.m === this.type).n;
    const stackBar = c => { const n = c.reduce((a, b) => a + b, 0) || 1; return `<div class="track">${[3, 2, 1, 0].map(l => `<span style="width:${c[l] / n * 100}%;background:${LEVELS[l].c}" title="${LEVELS[l].n}: ${c[l]}"></span>`).join('')}</div>`; };
    $('#page').innerHTML = `<div class="page-inner stack" style="gap:22px">
      <header class="stack" style="gap:6px"><h1>Tu progreso</h1><p class="muted">La app guarda cada país por tipo de pregunta: saberte la capital de Malí no cuenta como saberte su bandera.</p></header>
      <div class="statrow">

        <div class="card bigstat"><span class="eyebrow">Racha</span><b>${STORE.streak()}</b><span class="small muted">${STORE.streak() === 1 ? 'día seguido' : 'días seguidos'} estudiando</span></div>
        <div class="card bigstat"><span class="eyebrow">Dominados</span><b>${nf.format(dom)}</b><span class="small muted">elementos en total</span></div>
        <div class="card bigstat"><span class="eyebrow">Días de estudio</span><b>${STORE.d.days.length}</b><span class="small muted">desde el principio</span></div>
      </div>
      <div class="card stack">
        <div class="row" style="justify-content:space-between"><h3>Mapa de progreso</h3><select id="ptype" aria-label="Tipo de pregunta" style="padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)"><option value="all">Media de todos los tipos</option>${POL_TYPES.map(t => `<option value="${t.m}" ${this.type === t.m ? 'selected' : ''}>${t.n}</option>`).join('')}</select></div>
        <div style="overflow:hidden"><svg id="pmap" viewBox="0 0 ${D.W} ${D.H}" style="width:100%;height:auto;display:block"></svg></div>
        <div class="row small">${LEVELS.map(l => `<span class="pill"><span class="dot" style="background:${l.c}"></span>${l.n}</span>`).join('')}<span class="muted">Pasa el ratón por un país para ver su nivel.</span></div>
      </div>

        <div class="sec"><h4>Reiniciar</h4><div class="row">${[['all', 'Todo'], ['pol', 'Países'], ['phy', 'Accidentes'], ['car', 'Cartografía']].map(([k, n]) => `<button class="btn sm danger" data-reset="${k}">${n}</button>`).join('')}</div>

      </div>
    </div>`;
    this.map();
    const P = $('#page');
    $$('[data-theme-set]', P).forEach(b => b.onclick = () => { setTheme(b.dataset.themeSet || null); this.render(); });
    $('#ptype').onchange = e => { this.type = e.target.value; this.render(); };
    $$('[data-go]', P).forEach(b => b.onclick = () => { switchTab('explorar'); EXPLORE.select(b.dataset.go); });
    const json = () => JSON.stringify(STORE.d);
    $('#exp').onclick = async () => {
      const fn = 'ultimate-atlas-progreso-' + new Date().toISOString().slice(0, 10) + '.json';

      <div class="clockrow"><span class="clock num" id="tclock">${this.mmss(g.left)}</span><span class="small muted">${g.mode === 'name' ? '' : `${g.ok} aciertos de ${g.n}`}</span></div>
      ${body}
      ${g.done && g.mode !== 'name' ? `<div class="result"><span class="big num">${g.ok}</span><span>aciertos de ${g.n}</span></div>` : ''}
      ${g.done ? `<div class="row"><button class="btn primary" id="tagain" style="height:44px">Jugar otra vez</button><button class="btn" id="thome" style="height:44px">Otros juegos</button></div>` : ''}
    </div>`);
    this.bindHead(); this.bindGo();
    if (g.done) { $('#tagain').onclick = () => this.start('clock'); $('#thome').onclick = () => this.home(); return; }
    if (g.mode === 'name') { this.countryInput($('#tin'), $('#tsugg'), id => this.clockName(id), id => D.info[id].state); if (!isMobile()) $('#tin').focus(); }
    $$('[data-co]').forEach(b => b.onclick = () => this.clockAns(b.dataset.co));
  },
  clockAns(v) { const g = this.g; if (g.done || g.ans) return; g.ans = v; g.n++; if (v === g.id) g.ok++; this.clockRender(); setTimeout(() => { if (this.g === g && !g.done) { this.clockQ(); this.clockRender(); } }, v === g.id ? 350 : 900); },
  clockName(id) {
    const g = this.g; if (g.done) return;
    if (!g.targets.includes(id)) { toast(`${nameOf(id)} no está en ${g.reg}`); return; }
    if (g.found.includes(id)) { toast('Ya lo tienes'); return; }
    g.found.push(id); MAP.cty.filter(d => d.id === id).style('fill', 'var(--hue)');
    if (g.found.length === g.targets.length) return this.clockEnd();
    this.clockRender(); $('#tin') && $('#tin').focus();
  },
  clockEnd() {
    const g = this.g; if (g.done) return; g.done = true; clearInterval(this._clk);
    const key = 'clock-' + g.mode + (g.mode === 'name' ? '-' + g.reg : '') + '-' + g.secs; const v = g.mode === 'name' ? g.found.length : g.ok;
    const s = this.st(); s.plays.clock = (s.plays.clock || 0) + 1; if (s.rec[key] == null || v > s.rec[key]) s.rec[key] = v; if (s.rec.clock == null || v > s.rec.clock) s.rec.clock = v; this.save();
    if (g.mode === 'name') MAP.cty.filter(d => g.targets.includes(d.id) && !g.found.includes(d.id)).style('fill', 'var(--negative)').style('fill-opacity', .55);
    g.over = true; this.clockRender();
  },
  /* ---------- reto del día ---------- */
  todayKey() { return new Date().toISOString().slice(0, 10); },
  dailyStreak() { const d = this.st().daily; let s = 0; const t = new Date(); if (!d[t.toISOString().slice(0, 10)]) t.setDate(t.getDate() - 1); while (d[t.toISOString().slice(0, 10)]) { s++; t.setDate(t.getDate() - 1); } return s; },
  dailyStart() {
    const k = this.todayKey(); if (this.st().daily[k]) return this.home();
    const seed = +k.replace(/-/g, ''); const r = mulberry32(seed);
    const pickM = arr => arr[Math.floor(r() * arr.length)];
    this.D = { k, seed, step: 0, res: [], plan: [['hl', pickM(['area', 'pop', 'north', 'south'])], ['hl', pickM(['dens', 'east', 'west', 'nb'])], ['ord', pickM(['area', 'pop', 'north', 'cappop'])], ['route'], ['sil']] };
    this.dailyStep();
  },
  dailyHead() { const D_ = this.D; return `<div class="panel-top"><button class="xbtn" id="tback"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>Juegos</button><span class="dgrid small">${[0, 1, 2, 3, 4].map(i => `<span class="dsq ${D_.res[i] || (i === D_.step ? 'cur' : '')}"></span>`).join('')}</span></div><div class="eyebrow">Reto del día · ${D_.step + 1} de 5</div>`; },
  dailyStep(res) {
    const D_ = this.D; if (!D_) return this.home();
    if (res) { D_.res.push(res); D_.step++; }
    if (D_.step >= 5) { const s = this.st(); s.daily[D_.k] = { res: D_.res }; this.save(); this.D = null; this.g = null; return this.home(); }
    const [k, m] = D_.plan[D_.step];
    this.start(k, { seed: D_.seed * 10 + D_.step, daily: true, metric: m, diff: 2, rounds: 1 });
  },
  /* tarjeta para la pestaña Progreso */
  progressCard() {
    const s = this.st(); const played = Object.values(s.plays).reduce((a, b) => a + b, 0) + Object.keys(s.daily).length;
    const worst = g => Object.entries(s.fails[g] || {}).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const wl = g => { const w = worst(g); return w.length ? w.map(([id, n]) => `${esc(nameOf(id))} <span class="muted">(${n})</span>`).join(', ') : '<span class="muted">Sin fallos todavía</span>'; };
    return `<div class="card stack"><div class="row" style="justify-content:space-between"><h3>Trivia</h3><span class="small muted">${played} ${played === 1 ? 'partida' : 'partidas'} · reto del día: racha de ${this.dailyStreak()} ${this.dailyStreak() === 1 ? 'día' : 'días'}</span></div>
      <dl class="facts">${TRV_GAMES.map(g => `<dt>${g.n}</dt><dd>${s.rec[g.k] != null ? g.rec(s.rec[g.k]) : '<span class="muted">Sin jugar</span>'}${s.plays[g.k] ? ` <span class="small muted">· ${s.plays[g.k]} ${s.plays[g.k] === 1 ? 'partida' : 'partidas'}</span>` : ''}</dd>`).join('')}</dl>
      <p class="small"><b>Más fallados en ¿Más o menos?:</b> ${wl('hl')}</p>
      <p class="small"><b>Más fallados en Recorrido:</b> ${wl('route')}</p></div>`;
  },
  share(k) {
    const d = this.st().daily[k]; if (!d) return; const [y, mo, da] = k.split('-');
    const txt = `Ultimate Atlas · Reto ${+da}/${+mo}/${y}\n${d.res.map(r => r === 'g' ? '🟩' : r === 'y' ? '🟨' : '🟥').join('')}  ${d.res.filter(r => r === 'g').length}/5`;
    const done = () => toast('Resultado copiado');
    try { navigator.clipboard.writeText(txt).then(done, () => toast(txt, 5000)); } catch (e) { toast(txt, 5000); }
  }
};
function confirmLeave() { return true; }
APP.tabs.trivia = TRIVIA;

/* ============ arranque ============ */
(async function boot() {
  STORE.load();
  try { await loadData(); } catch (e) { $('#loading').textContent = 'No se pudieron cargar los datos del atlas (' + e.message + '). Recarga la página.'; return; }
  initShell(); MAP.init();
  MAP.on('click', (id, ev, w) => { const t = APP.tabs[APP.tab]; if (t && t.click) t.click(id, ev, w); });
  MAP.on('hover', (id, ev) => { const t = APP.tabs[APP.tab]; if (t && t.hover) t.hover(id, ev); else tooltip(null); });
  MAP.on('resize', () => { const t = APP.tabs[APP.tab]; if (t && t.resized) t.resized(); });
  document.addEventListener('keydown', e => { const t = APP.tabs[APP.tab]; if (t && t.key) t.key(e); });
  APP.refresh = () => { const t = APP.tabs[APP.tab]; if (t && t.refresh) t.refresh(); };
  $('#loading').remove();
  const h = location.hash.slice(1);
  switchTab(APP.tabs[h] ? h : (APP.tabs[lsGet('atlas-tab')] ? lsGet('atlas-tab') : 'explorar'));
  REMOTE.init();
})();

</script>
